<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صمم ديكورك — غرفة النوم</title>
<style>
:root{--ink:#263126;--green:#344c35;--cream:#fbf8f1;--line:#d9cfbf;--muted:#766e63}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
.page{max-width:1100px;margin:auto;padding:18px}header{height:70px;display:flex;justify-content:space-between;align-items:center}
button,input,select{font:inherit}.back{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px;cursor:pointer}
.hero{background:linear-gradient(135deg,#eadfce,#cdbba2);border:1px solid var(--line);border-radius:28px;padding:28px}.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:var(--muted);line-height:1.8}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;cursor:pointer}.option.active{border:2px solid var(--green);background:#f0f4ee}
.muted{color:var(--muted);font-size:13px}label{display:block;margin:16px 0 7px;font-weight:bold}
input[type=number],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}
.preview{height:350px;border-radius:20px;background:linear-gradient(#eee7dc 0 68%,#b99b72 69%);position:relative;overflow:hidden}
.wall{position:absolute;left:7%;right:7%;top:12%;height:42%;background:#d8c7af;border-radius:8px}.head{position:absolute;left:28%;right:28%;bottom:7%;height:56%;background:#60705f;border-radius:14px 14px 5px 5px}
.mattress{position:absolute;left:23%;right:23%;bottom:30%;height:20%;background:#f5efe4;border-radius:12px}
.pillow{position:absolute;bottom:34%;width:20%;height:10%;background:#fff;border-radius:8px}.p1{right:28%}.p2{left:28%}
.wardrobe{position:absolute;right:8%;bottom:8%;width:19%;height:55%;background:#cdbda6;border-radius:6px;display:flex;gap:3px;padding:4px}.wardrobe span{flex:1;background:#e6ddcf;border-radius:3px}
.result{margin-top:15px;background:var(--green);color:white;border-radius:20px;padding:18px}.price{font-size:30px;font-weight:bold;margin:7px 0}
.save{width:100%;border:0;background:white;color:var(--ink);border-radius:13px;padding:12px;margin-top:10px;cursor:pointer}
.note{background:#f5f0e7;border-radius:14px;padding:12px;margin-top:12px;font-size:13px;line-height:1.8}
@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body><div class="page">
<header><button class="back" onclick="history.back()">← رجوع</button><b style="font-size:22px">صمم ديكورك</b></header>
<section class="hero"><h1>صمّم غرفة نومك</h1><p>اختار نوع السرير، دخل القياسات، حدد الخامة والتشطيب، وشوف تقدير أولي للمشروع.</p></section>
<div class="layout">
<section class="card">
<h2>1. نوع السرير</h2>
<div class="grid">
<button class="option active" onclick="bed(this,'مزدوج')"><b>مزدوج</b><br><span class="muted">ستايل كلاسيكي</span></button>
<button class="option" onclick="bed(this,'مخفي')"><b>مخفي</b><br><span class="muted">اقتصاد فالمساحة</span></button>
<button class="option" onclick="bed(this,'ملكي')"><b>ملكي</b><br><span class="muted">ظهر راقي</span></button>
<button class="option" onclick="bed(this,'منصة')"><b>منصة</b><br><span class="muted">ستايل عصري</span></button>
</div>
<h2 style="margin-top:25px">2. القياسات</h2>
<div class="grid">
<div><label>الطول (م)</label><input id="l" type="number" value="4" min="2" step=".1" oninput="calc()"></div>
<div><label>العرض (م)</label><input id="w" type="number" value="3.5" min="2" step=".1" oninput="calc()"></div>
</div>
<label>الخامة</label>
<select id="m" onchange="calc()"><option value="650">MDF اقتصادي</option><option value="900" selected>MDF + ميلامين</option><option value="1250">Lacquer راقي</option><option value="1700">خشب طبيعي Premium</option></select>
<label>التشطيب</label>
<select id="f" onchange="calc()"><option value="1">اقتصادي</option><option value="1.2" selected>متوسط</option><option value="1.45">Premium</option><option value="1.8">Luxury</option></select>
<div class="note">الثمن تقريبي. من بعد نزيدو البلاكار، الإضاءة، الطاولات الجانبية والإكسسوارات بالتفصيل.</div>
</section>
<section class="card"><h2>المعاينة الأولية</h2>
<div class="preview"><div class="wall"></div><div class="wardrobe"><span></span><span></span><span></span></div><div class="head"></div><div class="mattress"></div><div class="pillow p1"></div><div class="pillow p2"></div></div>
<div class="result">المساحة: <b id="a">14</b> m²<div class="price"><span id="p">15,120</span> DH</div><span class="muted" style="color:#d8dfd6">تقدير أولي حسب الاختيارات</span>
<button class="save" onclick="alert('تم حفظ تصميم غرفة النوم التجريبي')">حفظ تصميم غرفة النوم</button></div></section>
</div></div>
<script>
let s='مزدوج';
function bed(e,x){document.querySelectorAll('.option').forEach(b=>b.classList.remove('active'));e.classList.add('active');s=x;calc()}
function calc(){let a=(+document.getElementById('l').value||0)*(+document.getElementById('w').value||0),q={مزدوج:1,مخفي:.9,ملكي:1.3,منصة:1.15}[s],t=Math.round(a*(+document.getElementById('m').value)*(+document.getElementById('f').value)*q/100)*100;document.getElementById('a').textContent=a.toFixed(1);document.getElementById('p').textContent=t.toLocaleString('fr-FR')}
calc();
</script></body></html>
