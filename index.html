<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>صمم ديكورك | Hamza Chtaibi</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f3;
color:#17211c;
line-height:1.7
}

a{text-decoration:none;color:inherit}
img{display:block;width:100%}

.wrap{
width:min(1180px,92%);
margin:auto
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:72px;
background:rgba(12,18,15,.94);
backdrop-filter:blur(12px);
z-index:1000;
border-bottom:1px solid rgba(207,210,212,.15)
}

.nav{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}

.logo{
font-size:25px;
font-weight:900;
color:#fff;
white-space:nowrap
}

.logo span{
color:#cfd2d4
}

.navlinks{
display:flex;
align-items:center;
gap:25px
}

.navlinks a{
color:#fff;
font-size:14px;
transition:.25s
}

.navlinks a:hover{
color:#cfd2d4
}

.lang{
display:flex;
gap:4px;
background:#27332d;
padding:4px;
border-radius:20px
}

.lang button{
border:0;
background:transparent;
color:#fff;
padding:6px 10px;
border-radius:15px;
cursor:pointer;
font-weight:bold
}

.lang button.active{
background:#cfd2d4;
color:#17211c
}

/* HERO */

.hero{
height:100vh;
min-height:650px;
position:relative;
overflow:hidden;
color:#fff;
padding-top:72px;
display:flex;
align-items:center
}

.hero-slides{
position:absolute;
inset:0;
z-index:0
}

.hero-slide{
position:absolute;
inset:0;
opacity:0;
background-position:center;
background-size:cover;
background-repeat:no-repeat;
transform:scale(1.05);
transition:opacity 1.2s ease,transform 6s ease
}

.hero-slide.active{
opacity:1;
transform:scale(1)
}

.hero-slide:nth-child(1){
background-image:url("images/hero-2.webp")
}

.hero-slide:nth-child(2){
background-image:url("images/hero-3.webp")
}

.hero-slide:nth-child(3){
background-image:url("images/kitchen.jpg")
}

.hero-slide:nth-child(4){
background-image:url("images/dressing.jpg")
}

.hero-slide:nth-child(5){
background-image:url("images/salon.jpg")
}

.hero-slide:nth-child(6){
background-image:url("images/bedroom.jpg")
}

.hero-slide:nth-child(7){
background-image:url("images/tv.jpg")
}

.hero-overlay{
position:absolute;
inset:0;
z-index:1;
background:
linear-gradient(
90deg,
rgba(5,10,7,.94),
rgba(5,10,7,.68),
rgba(5,10,7,.18)
)
}

.hero-content{
position:relative;
z-index:2;
max-width:720px
}

.kicker{
font-size:12px;
letter-spacing:3px;
color:#cfd2d4;
font-weight:bold;
margin-bottom:15px
}

.hero h1{
font-size:clamp(44px,7vw,82px);
line-height:1.05;
margin-bottom:22px;
font-weight:900
}

.hero h1 span{
color:#cfd2d4
}

.hero p{
font-size:18px;
color:#f0f0f0;
max-width:650px;
margin-bottom:30px
}

.buttons{
display:flex;
gap:12px;
flex-wrap:wrap
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 25px;
min-height:50px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
transition:.25s
}

.btn:hover{
transform:translateY(-2px)
}

.btn-light{
background:#cfd2d4;
color:#17211c
}

.btn-dark{
background:#17211c;
color:#fff
}

.btn-outline{
border:1px solid #fff;
color:#fff;
background:rgba(0,0,0,.12)
}

.btn-outline:hover{
background:#fff;
color:#17211c
}

/* DOTS */

.slider-dots{
position:absolute;
z-index:3;
bottom:28px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:7px
}

.slider-dot{
width:8px;
height:8px;
border-radius:50%;
background:#ffffff66;
cursor:pointer;
transition:.3s
}

.slider-dot.active{
width:28px;
border-radius:10px;
background:#cfd2d4
}

/* QUICK */

.quick{
background:#fff;
padding:24px 0;
border-bottom:1px solid #ddd
}

.quick-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.quick-item{
display:flex;
align-items:center;
gap:11px
}

.quick-number{
width:40px;
height:40px;
min-width:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#17211c;
color:#cfd2d4;
font-weight:bold
}

/* SECTIONS */

section{
padding:85px 0
}

.section-title{
text-align:center;
margin-bottom:40px
}

.section-title small{
color:#68716c;
letter-spacing:2px;
font-weight:bold
}

.section-title h2{
font-size:clamp(30px,5vw,50px);
margin:5px 0
}

.section-title p{
color:#707873
}

/* CHOICES */

.choices{
background:#17211c;
color:#fff
}

.choices .section-title small{
color:#cfd2d4
}

.choices .section-title p{
color:#c4ccc7
}

.choice-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:17px
}

.choice{
height:310px;
position:relative;
overflow:hidden;
border-radius:8px;
background:#111
}

.choice img{
height:100%;
object-fit:cover;
transition:.5s
}

.choice:hover img{
transform:scale(1.07)
}

.choice:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(4,8,6,.95),
rgba(4,8,6,.02)
)
}

.choice-info{
position:absolute;
bottom:18px;
right:18px;
left:18px;
z-index:2
}

.choice-info h3{
font-size:23px
}

.choice-info p{
font-size:13px;
color:#d0d5d2
}

/* SPECIAL */

.special{
background:#e7e8e6
}

.special-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

.special-card{
background:#fff;
padding:35px;
border-radius:8px;
border:1px solid #d8dad8
}

.special-card h3{
font-size:25px;
margin-bottom:8px
}

.special-card p{
color:#707873;
margin-bottom:20px
}

/* WORKS */

.works{
background:#fff;
text-align:center
}

.works-preview{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:30px
}

.work-image{
height:210px;
overflow:hidden;
border-radius:7px
}

.work-image img{
height:100%;
object-fit:cover;
transition:.4s
}

.work-image:hover img{
transform:scale(1.06)
}

.works-btn{
display:inline-flex;
padding:14px 30px;
background:#17211c;
color:#fff;
border-radius:6px;
font-weight:bold
}

/* PARTNERS */

.partners{
background:#eeeeec
}

.partner-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.partner{
background:#fff;
min-height:100px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #ddd;
font-weight:bold;
color:#626b66
}

/* FOOTER */

footer{
background:#0e1511;
color:#999;
text-align:center;
padding:30px
}

footer strong{
color:#cfd2d4
}

/* WHATSAPP */

.whatsapp{
position:fixed;
left:18px;
bottom:18px;
width:56px;
height:56px;
border-radius:50%;
background:#25d366;
display:flex;
align-items:center;
justify-content:center;
z-index:3000;
box-shadow:0 5px 20px #0005
}

.whatsapp svg{
width:30px;
height:30px;
fill:#fff
}

/* MOBILE */

@media(max-width:850px){

.navlinks{
display:none
}

.quick-grid{
grid-template-columns:1fr 1fr
}

.choice-grid{
grid-template-columns:1fr 1fr
}

.works-preview{
grid-template-columns:1fr 1fr
}

.partner-grid{
grid-template-columns:1fr 1fr
}

.special-grid{
grid-template-columns:1fr
}

}

@media(max-width:550px){

.hero{
min-height:650px;
text-align:center
}

.hero-content{
margin:auto
}

.hero p{
font-size:16px
}

.buttons{
flex-direction:column
}

.btn{
width:100%
}

.choice-grid{
grid-template-columns:1fr
}

.works-preview{
grid-template-columns:1fr 1fr
}

.work-image{
height:170px
}

}

@media(prefers-reduced-motion:reduce){

.hero-slide{
transition:none
}

.choice img,
.work-image img{
transition:none
}

}
</style>
</head>

<body>

<header>

<div class="wrap nav">

<a href="index.html" class="logo">
صمم <span>ديكورك</span>
</a>

<nav class="navlinks">

<a href="#choices" data-i18n="design">
صمم دابا
</a>

<a href="works.html" data-i18n="works">
أعمالنا
</a>

<a href="#special" data-i18n="special">
الخدمات الخاصة
</a>

</nav>

<div class="lang">

<button id="arBtn"
class="active"
onclick="setLang('ar')">
دارجة
</button>

<button id="frBtn"
onclick="setLang('fr')">
FR
</button>

</div>

</div>
</header>
