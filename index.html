<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة صمم ديكورك</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f5f3;
  color:#17211c;
}

header{
  background:#0c120f;
  color:#fff;
  padding:18px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#cfd2d4;
}

.container{
  width:min(1100px,94%);
  margin:30px auto;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 5px 20px #0000000a;
}

h1{
  margin-bottom:8px;
}

h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-family:inherit;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  background:#17211c;
  color:#fff;
  padding:13px 22px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin-top:15px;
}

.btn:hover{
  opacity:.9;
}

.btn-light{
  background:#cfd2d4;
  color:#17211c;
}

.drop{
  border:2px dashed #bfc4c1;
  border-radius:10px;
  padding:35px;
  text-align:center;
  cursor:pointer;
  background:#fafafa;
}

.drop:hover{
  background:#f1f2f0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.preview-item{
  position:relative;
  border-radius:8px;
  overflow:hidden;
  background:#111;
}

.preview-item img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.preview-name{
  padding:8px;
  background:#111;
  color:#fff;
  font-size:12px;
}

.progress{
  height:8px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
  display:none;
}

.progress-bar{
  height:100%;
  width:0;
  background:#17211c;
  transition:.2s;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  display:none;
}

.success{
  background:#e4f7e9;
  color:#146c2e;
}

.error{
  background:#fde5e5;
  color:#9b1c1c;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.gallery-item{
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  overflow:hidden;
}

.gallery-item img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.gallery-info{
  padding:10px;
}

.gallery-info strong{
  display:block;
  margin-bottom:5px;
}

.price{
  font-weight:bold;
}

@media(max-width:800px){
  .preview,
  .gallery{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .preview,
  .gallery{
    grid-template-columns:1fr;
  }

  header{
    flex-direction:column;
    gap:8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    صمم <span>ديكورك</span>
  </div>

  <a href="index.html" class="btn btn-light">
    رجوع للموقع
  </a>
</header>

<div class="container">

  <div class="card">

    <h1>إدارة الموقع</h1>

    <p>
      من هنا تقدر ترفع الصور والمشاريع والمنتجات.
    </p>

  </div>


  <!-- رفع -->

  <div class="card">

    <h2>📸 إضافة صورة جديدة</h2>

    <label>القسم</label>

    <select id="category">

      <option value="works">
        أعمالنا
      </option>

      <option value="tapisserie">
        التابيسري
      </option>

      <option value="products">
        المنتجات
      </option>

      <option value="partners">
        الشركاء
      </option>

      <option value="hero">
        صور الصفحة الرئيسية
      </option>

    </select>


    <label>اسم الصورة / المنتج</label>

    <input
      id="title"
      type="text"
      placeholder="مثال: مطبخ مودرن أبيض"
    >


    <label>الثمن بالدرهم — اختياري</label>

    <input
      id="price"
      type="number"
      placeholder="مثال: 3500"
    >


    <label>الوصف — اختياري</label>

    <textarea
      id="description"
      placeholder="مثال: MDF mélaminé مع plan de travail Quartz"
    ></textarea>


    <label>اختار الصور</label>

    <div
      class="drop"
      onclick="document.getElementById('files').click()"
    >

      📁 اضغط هنا لاختيار الصور

      <br>

      <small>
        يمكنك اختيار أكثر من صورة
      </small>

    </div>

    <input
      id="files"
      type="file"
      accept="image/*"
      multiple
      hidden
    >


    <div
      id="preview"
      class="preview"
    ></div>


    <button
      class="btn"
      onclick="uploadImages()"
    >
      ⬆️ رفع الصور
    </button>


    <div
      id="progress"
      class="progress"
    >
      <div
        id="progressBar"
        class="progress-bar"
      ></div>
    </div>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- المحتوى الحالي -->

  <div class="card">

    <h2>🖼️ الصور الموجودة</h2>

    <button
      class="btn"
      onclick="loadGallery()"
    >
      تحديث الصور
    </button>

    <div
      id="gallery"
      class="gallery"
      style="margin-top:20px"
    ></div>

  </div>

</div>


<script>

const filesInput =
document.getElementById("files");

const preview =
document.getElementById("preview");

const statusBox =
document.getElementById("status");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");


filesInput.addEventListener(
"change",
function(){

  preview.innerHTML="";

  [...this.files].forEach(file=>{

    const reader =
    new FileReader();

    reader.onload=function(e){

      const item =
      document.createElement("div");

      item.className=
      "preview-item";

      item.innerHTML=`

        <img src="${e.target.result}">

        <div class="preview-name">
          ${file.name}
        </div>

      `;

      preview.appendChild(item);

    };

    reader.readAsDataURL(file);

  });

});


function showStatus(message,type){

  statusBox.style.display="block";

  statusBox.className=
  "status "+type;

  statusBox.textContent=
  message;
}


async function getSignature(folder){

  const response =
  await fetch(
    "/api/sign-upload",
    {
      method:"POST",
      headers:{
        "Content-Type":
        "application/json"
      },
      body:JSON.stringify({
        folder:folder
      })
    }
  );

  if(!response.ok){

    throw new Error(
      "تعذر الحصول على توقيع الرفع"
    );

  }

  return response.json();

}


async function uploadOne(file){

  const category =
  document.getElementById("category").value;

  const title =
  document.getElementById("title").value.trim();

  const price =
  document.getElementById("price").value.trim();

  const description =
  document.getElementById("description").value.trim();


  const folder =
  "samemdecork/" + category;


  const signature =
  await getSignature(folder);


  const form =
  new FormData();


  form.append(
    "file",
    file
  );

  form.append(
    "api_key",
    signature.api_key
  );

  form.append(
    "timestamp",
    signature.timestamp
  );

  form.append(
    "signature",
    signature.signature
  );

  form.append(
    "folder",
    folder
  );


  if(title){

    form.append(
      "context",
      "title="+title+
      "|price="+price+
      "|description="+description
    );

  }


  const xhr =
  new XMLHttpRequest();


  return new Promise(
    (resolve,reject)=>{

      xhr.open(
        "POST",
        signature.upload_url
      );


      xhr.upload.onprogress =
      function(event){

        if(event.lengthComputable){

          const percent =
          Math.round(
            event.loaded /
            event.total *
            100
          );

          progressBar.style.width=
          percent+"%";

        }

      };


      xhr.onload=function(){

        if(
          xhr.status>=200 &&
          xhr.status<300
        ){

          resolve(
            JSON.parse(xhr.responseText)
          );

        }else{

          reject(
            new Error(
              "فشل رفع الصورة"
            )
          );

        }

      };


      xhr.onerror=function(){

        reject(
          new Error(
            "مشكل في الاتصال"
          )
        );

      };


      xhr.send(form);

    }
  );

}


async function uploadImages(){

  const files =
  [...filesInput.files];


  if(!files.length){

    showStatus(
      "اختار صورة واحدة على الأقل.",
      "error"
    );

    return;

  }


  progress.style.display=
  "block";

  progressBar.style.width=
  "0%";


  showStatus(
    "جاري رفع الصور...",
    "success"
  );


  try{

    for(
      let i=0;
      i<files.length;
      i++
    ){

      await uploadOne(
        files[i]
      );

      progressBar.style.width=
      (
        ((i+1)/files.length)*100
      )+"%";

    }


    showStatus(
      "✅ تم رفع جميع الصور بنجاح.",
      "success"
    );


    filesInput.value="";
    preview.innerHTML="";


    loadGallery();


  }catch(error){

    console.error(error);

    showStatus(
      "❌ وقع مشكل أثناء الرفع. تأكد من إعدادات Cloudinary وVercel.",
      "error"
    );

  }

}


async function loadGallery(){

  const gallery =
  document.getElementById("gallery");


  gallery.innerHTML=
  "<p>جاري تحميل الصور...</p>";


  try{

    const category =
    document.getElementById("category").value;


    const response =
    await fetch(
      "/api/media?category="+
      encodeURIComponent(category)
    );


    if(!response.ok){

      throw new Error();

    }


    const data =
    await response.json();


    gallery.innerHTML="";


    if(!data.resources ||
       !data.resources.length){

      gallery.innerHTML=
      "<p>ما كايناش صور في هاد القسم.</p>";

      return;

    }


    data.resources.forEach(item=>{

      const context =
      item.context || {};

      const title =
      context.title ||
      item.public_id
      .split("/")
      .pop();


      const price =
      context.price || "";


      const div =
      document.createElement("div");

      div.className=
      "gallery-item";


      div.innerHTML=`

        <img
          src="${item.secure_url}"
          loading="lazy"
        >

        <div class="gallery-info">

          <strong>
            ${escapeHtml(title)}
          </strong>

          ${
            price
            ?
            `<div class="price">
              ${escapeHtml(price)} DH
            </div>`
            :
            ""
          }

        </div>

      `;


      gallery.appendChild(div);

    });


  }catch(error){

    gallery.innerHTML=
    "<p>تعذر تحميل الصور.</p>";

  }

}


function escapeHtml(text){

  return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


document
.getElementById("category")
.addEventListener(
"change",
loadGallery
);


loadGallery();

</script>

</body>
</html>
