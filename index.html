<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="صمم ديكورك — تصميم وتنفيذ المطابخ، الخزائن، موبيلات التلفاز والديكور. أعمال حقيقية من chtaibi hamza.">
<title>صمم ديكورك — أعمال chtaibi hamza</title>
<style>
:root{--ink:#4A3026;--green:#9B4F3F;--sage:#71806c;--sand:#F1E7DF;--cream:#FCFAF7;--gold:#A96850;--line:#D7C5BA}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}.page{max-width:1200px;margin:auto;padding:16px}
header{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;border:2px solid var(--ink);border-radius:14px;background:#fff;position:relative;overflow:hidden}.mark:before{content:"";position:absolute;inset:0 48% 0 0;background:var(--ink);clip-path:polygon(0 0,100% 12%,82% 100%,0 88%)}.mark:after{content:"✎";position:absolute;left:8px;top:8px;color:white;font-size:21px}.brand b{font-size:21px}.brand small{display:block;color:#7D685E;margin-top:2px}.headerBtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;color:var(--ink)}
.hero{margin-top:8px;background:#EFE2D9;border:1px solid var(--line);border-radius:30px;overflow:hidden;display:grid;grid-template-columns:.92fr 1.08fr;min-height:470px;box-shadow:0 18px 45px #40352212}.copy{padding:48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--gold);font-weight:bold}.copy h1{font-size:43px;line-height:1.25;margin:13px 0}.copy p{line-height:2;color:#705A50;max-width:540px}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary{border-radius:15px;padding:14px 21px;cursor:pointer}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.heroPhoto{position:relative;min-height:470px;background:#D8C3B7}.heroPhoto img{width:100%;height:100%;min-height:470px;object-fit:cover;display:block}.heroShade{position:absolute;inset:0;background:linear-gradient(90deg,#1e261c45,transparent 45%)}.heroLabel{position:absolute;bottom:18px;right:18px;background:#fffdf8e8;border:1px solid #fff;border-radius:15px;padding:10px 14px;font-size:13px}
.dots{position:absolute;left:18px;bottom:18px;display:flex;gap:6px}.dot{width:9px;height:9px;border:0;border-radius:50%;background:#fff9;cursor:pointer}.dot.active{background:#fff;width:24px;border-radius:8px}
.search{margin:-27px auto 0;position:relative;max-width:800px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px 19px;box-shadow:0 10px 25px #34271a15;display:flex;gap:10px;align-items:center}.search input{border:0;outline:0;width:100%;background:transparent}
.section{margin-top:38px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:15px}.sectionTitle h2{margin:0;font-size:25px}.muted{color:#7D685E;font-size:13px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trust .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.trust b{display:block;margin-bottom:5px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.work{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:.2s}.work:hover{transform:translateY(-3px);box-shadow:0 12px 25px #34271a16}.work img{width:100%;aspect-ratio:1.08/1;object-fit:cover;display:block}.workInfo{padding:11px 13px}.workInfo b{font-size:14px}.workInfo span{display:block;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 14px;cursor:pointer}.filter.active{background:var(--green);color:#fff}
.about{background:var(--green);color:#fff;border-radius:25px;padding:25px}.about p{line-height:1.9;color:#e3e8e1}.about .name{font-size:18px;font-weight:bold}
.lightbox{position:fixed;inset:0;background:#111c;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.lightbox.show{display:flex}.lightbox img{max-width:min(1100px,96vw);max-height:88vh;border-radius:18px}.close{position:fixed;top:18px;left:18px;border:0;background:#fff;color:#222;border-radius:50%;width:42px;height:42px;font-size:23px;cursor:pointer}
footer{margin:42px 0 14px;text-align:center;color:#8A756A;font-size:13px}
.nav{position:sticky;bottom:10px;margin:25px auto 0;max-width:760px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px;display:flex;justify-content:space-around;box-shadow:0 12px 28px #34271a18}.nav a{color:var(--ink);text-decoration:none;padding:10px 14px;border-radius:13px;text-align:center;font-size:12px}.nav a.active{background:var(--green);color:white}
@media(max-width:800px){.hero{grid-template-columns:1fr}.heroPhoto{order:-1;min-height:340px}.heroPhoto img{min-height:340px}.copy{padding:32px 24px}.copy h1{font-size:34px}.gallery{grid-template-columns:repeat(2,1fr)}.trust{grid-template-columns:1fr}.nav a{padding:9px 8px}}
@media(max-width:480px){.page{padding:11px}.headerBtn{display:none}.heroPhoto,.heroPhoto img{min-height:280px}.copy h1{font-size:30px}.gallery{gap:9px}.work{border-radius:15px}.workInfo{padding:9px}.sectionTitle{align-items:flex-start;flex-direction:column}}

.heroPhoto{overflow:hidden}
.heroPhoto img{transform:scale(1.04);animation:heroLife 9s ease-in-out infinite alternate;transform-origin:center}
@keyframes heroLife{0%{transform:scale(1.04) translate3d(0,0,0)}100%{transform:scale(1.12) translate3d(-1.5%, -1%, 0)}}
.heroPhoto:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-120%);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,45%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.aiPulse{animation:aiPulse 2.4s ease-in-out infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 0 0 0 rgba(155,79,63,.18)}50%{box-shadow:0 0 0 10px rgba(155,79,63,0)}}
.designCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.designCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:var(--ink);display:block;transition:.2s}
.designCard:hover{transform:translateY(-3px);border-color:var(--gold)}
.designCard .ico{font-size:25px;margin-bottom:8px}
.designCard b{display:block;margin-bottom:5px}
@media(max-width:800px){.designCards{grid-template-columns:1fr}}

</head>
