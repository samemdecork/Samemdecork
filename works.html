<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أعمالنا | صمم ديكورك</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f4f2;
color:#17211c;
line-height:1.7;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

header{
height:72px;
background:#0c120f;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 20px #0004;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
color:#fff;
}

.logo span{
color:#cfd2d4;
}

.back{
background:#cfd2d4;
color:#17211c;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
}

.hero{
padding:70px 0 40px;
text-align:center;
background:#17211c;
color:#fff;
}

.hero small{
color:#cfd2d4;
letter-spacing:3px;
}

.hero h1{
font-size:clamp(35px,6vw,60px);
margin:8px 0;
}

.hero p{
color:#cbd1ce;
}

.gallery{
padding:60px 0 90px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

.card{
height:280px;
background:#ddd;
border-radius:10px;
overflow:hidden;
box-shadow:0 8px 25px #0001;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.5s;
}

.card:hover img{
transform:scale(1.06);
}

.loading{
text-align:center;
padding:50px;
font-weight:bold;
}

.empty{
display:none;
text-align:center;
padding:60px 20px;
background:#fff;
border-radius:10px;
color:#777;
}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
height:220px;
}

}

</style></head><body><header><div class="wrap nav"><a href="index.html" class="logo">
صمم <span>ديكورك</span>
</a><a href="index.html" class="back">
الرئيسية
</a></div></header><section class="hero"><div class="wrap"><small>REAL PROJECTS</small>

<h1>أعمالنا</h1><p>
شوف المشاريع الحقيقية ديال صمم ديكورك
</p></div></section><section class="gallery"><div class="wrap"><div id="loading" class="loading">
جاري تحميل الصور...
</div><div id="gallery" class="grid"></div><div id="empty" class="empty">
مازال ما تزادت حتى صورة.
</div></div></section><footer><strong>صمم ديكورك</strong> © 2026

<br>جميع الحقوق محفوظة — Hamza Chtaibi

</footer><script>

async function loadWorks(){

const loading =
document.getElementById("loading");

const gallery =
document.getElementById("gallery");

const empty =
document.getElementById("empty");

try{

const response =
await fetch("/api/gallery?type=works");

const data =
await response.json();

loading.style.display="none";

if(
!data.success ||
!data.images ||
data.images.length===0
){

empty.style.display="block";
return;

}

data.images.forEach(image=>{

const card =
document.createElement("div");

card.className="card";

const img =
document.createElement("img");

img.src=image.url;

img.alt="مشروع صمم ديكورك";

img.loading="lazy";

card.appendChild(img);

gallery.appendChild(card);

});

}catch(error){

console.error(error);

loading.style.display="none";

empty.style.display="block";

empty.textContent=
"وقع مشكل في تحميل الصور.";

}

}

loadWorks();

</script></body>
</html>
