<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإكسسوارات و Electroménager</title>

<style>
body{
margin:0;
font-family:Tahoma,Arial;
background:#f3f3f1;
color:#17211c
}
header{
background:#17211c;
color:white;
padding:20px
}
.wrap{
width:min(1100px,92%);
margin:auto
}
main{padding:60px 0}
.title{text-align:center;margin-bottom:40px}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}
.card{
background:white;
border:1px solid #ddd;
padding:20px;
border-radius:6px
}
.card h3{margin-top:0}
.card p{color:#777}
.btn{
display:inline-block;
padding:10px 18px;
background:#17211c;
color:white;
border-radius:4px
}
@media(max-width:700px){
.grid{grid-template-columns:1fr 1fr}
}
@media(max-width:450px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<strong>صمم ديكورك</strong>
</div>
</header>

<main>

<div class="wrap">

<div class="title">
<h1>الإكسسوارات و Electroménager</h1>
<p>
منتجات وتجهيزات للبيع للمطابخ والديكور.
</p>
</div>

<div class="grid">

<div class="card">
<h3>إكسسوارات المطابخ</h3>
<p>سلال، tiroirs، تجهيزات داخلية...</p>
<a class="btn" href="#">المنتجات</a>
</div>

<div class="card">
<h3>LED والإضاءة</h3>
<p>إضاءة وتجهيزات LED.</p>
<a class="btn" href="#">المنتجات</a>
</div>

<div class="card">
<h3>Electroménager</h3>
<p>أفران، plaques، hottes، micro-ondes...</p>
<a class="btn" href="#">المنتجات</a>
</div>

</div>

</div>

</main>

</body>
</html>
