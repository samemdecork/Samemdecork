<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>أعمالنا | صمم ديكورك</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f4f2;
color:#17211c;
line-height:1.7;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

/* HEADER */

header{
height:72px;
background:#0c120f;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 20px #0004;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
color:white;
}

.logo span{
color:#cfd2d4;
}

.back{
background:#cfd2d4;
color:#17211c;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
}

/* HERO */

.hero{
padding:70px 0 40px;
text-align:center;
background:#17211c;
color:white;
}

.hero small{
color:#cfd2d4;
letter-spacing:3px;
}

.hero h1{
font-size:clamp(35px,6vw,60px);
margin:8px 0;
}

.hero p{
color:#cbd1ce;
}

/* GALLERY */

.gallery{
padding:60px 0 90px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

/* IMAGE CARD */

.card{
height:280px;
background:#ddd;
border-radius:10px;
overflow:hidden;
position:relative;
box-shadow:0 8px 25px #0001;
}

.card img,
.card video{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.card img{
transition:.5s;
}

.card:hover img{
transform:scale(1.06);
}

/* VIDEO */

.video-card{
background:#000;
}

.video-card video{
object-fit:cover;
}

/* VIDEO LABEL */

.video-label{
position:absolute;
top:12px;
right:12px;
z-index:5;
background:#17211c;
color:#fff;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* LOADING */

.loading{
text-align:center;
padding:50px;
font-weight:bold;
}

/* ERROR */

.error{
text-align:center;
padding:25px;
background:white;
border-radius:10px;
color:#a33;
display:none;
margin-bottom:25px;
}

/* MOBILE */

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
height:220px;
}

}

</style></head><body><header><div class="wrap nav"><a href="index.html" class="logo">

الرئيسية
</a></div></header><!-- HERO --><section class="hero"><div class="wrap"><small>REAL PROJECTS</small>

<h1>أعمالنا</h1><p>

</p></div></section><!-- GALLERY --><section class="gallery"><div class="wrap"><div id="loading" class="loading">

</div><div id="error" class="error">

</div><div class="card">

</div><div class="card">

</footer><script>

async function loadVideos(){

const gallery =
document.getElementById("gallery");

const loading =
document.getElementById("loading");

const error =
document.getElementById("error");

try{

const response =
await fetch("/api/videos");

if(!response.ok){
throw new Error("API error");
}

const data =
await response.json();

loading.style.display="none";

if(!data.success){
throw new Error(data.error || "API error");
}

/*
الفيديوهات فقط من:
samemdecork/works-videos

الصور الموجودة فـ Cloudinary
ما عندها حتى علاقة بهذا الجزء.
*/

if(!data.videos || data.videos.length===0){

return;

}

data.videos.forEach((video,index)=>{

const card =
document.createElement("div");

card.className="card video-card";

const label =
document.createElement("div");

label.className="video-label";

label.textContent="VIDEO";

const player =
document.createElement("video");

player.src=video.url;

player.controls=true;

player.playsInline=true;

player.preload="metadata";

player.setAttribute(
"aria-label",
"فيديو من أعمال صمم ديكورك"
);

card.appendChild(player);
card.appendChild(label);

gallery.appendChild(card);

});

}catch(err){

console.error("Video loading error:",err);

loading.style.display="none";

/*
ما نظهروش Error للزائر.
الفيديو إضافة فقط، والصور تبقى خدامة.
*/

}

}

loadVideos();

</script></body>
</html>
