<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب تصميم بالذكاء الاصطناعي | صمم ديكورك</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f0e8;
  color:#17231d;
}

.container{
  width:min(700px,92%);
  margin:40px auto 80px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 35px #0001;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#c9aa7b;
}

.subtitle{
  text-align:center;
  color:#777;
  line-height:1.8;
  margin-bottom:28px;
}

label{
  display:block;
  font-weight:bold;
  margin:18px 0 8px;
}

select,
input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:14px;
  font-family:inherit;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.upload-box{
  border:2px dashed #c9aa7b;
  border-radius:15px;
  padding:25px 15px;
  text-align:center;
  cursor:pointer;
  background:#faf8f4;
}

.upload-box:hover{
  background:#f2eadf;
}

.upload-icon{
  font-size:40px;
  margin-bottom:8px;
}

.upload-text{
  font-weight:bold;
}

.upload-small{
  color:#888;
  font-size:13px;
  margin-top:6px;
}

#photo{
  display:none;
}

.preview{
  display:none;
  margin-top:15px;
  border-radius:15px;
  overflow:hidden;
  background:#eee;
}

.preview img{
  display:block;
  width:100%;
  max-height:400px;
  object-fit:contain;
}

.remove{
  width:100%;
  border:0;
  padding:10px;
  background:#eee;
  cursor:pointer;
  font-family:inherit;
}

.send{
  width:100%;
  border:0;
  margin-top:25px;
  padding:17px;
  border-radius:12px;
  background:#25D366;
  color:white;
  font-family:inherit;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  line-height:1.8;
  text-align:center;
}

.loading{
  display:block;
  background:#f5f0e8;
  color:#17231d;
}

.success{
  display:block;
  background:#e9f7ed;
  color:#176b2c;
}

.error{
  display:block;
  background:#fdecec;
  color:#b3261e;
}

.note{
  margin-top:20px;
  background:#17231d;
  color:white;
  border-radius:14px;
  padding:18px;
  line-height:2;
  font-size:14px;
}

.note strong{
  color:#c9aa7b;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      صمم <span>ديكورك</span>
    </div>

    <div class="subtitle">
      صيفط لينا صورة ديال البلاصة اللي بغيتي تصاوب،
      وعمر المعلومات باش نوجدو ليك التصميم.
    </div>


    <!-- القسم -->

    <label>
      شنو بغيتي تصاوب؟
    </label>

    <select id="section">

      <option value="مطبخ">
        🍳 مطبخ
      </option>

      <option value="صالون">
        🛋️ صالون
      </option>

      <option value="غرفة نوم">
        🛏️ غرفة نوم
      </option>

      <option value="Dressing / Placard">
        🚪 Dressing / Placard
      </option>

      <option value="Meuble TV">
        📺 Meuble TV
      </option>

      <option value="طابيسري وستور">
        🧵 طابيسري وستور
      </option>

      <option value="أخرى">
        🏠 أخرى
      </option>

    </select>


    <!-- الصورة -->

    <label>
      📸 صورة البلاصة
    </label>

    <label for="photo" class="upload-box">

      <div class="upload-icon">
        📷
      </div>

      <div class="upload-text">
        ضغط هنا واختار صورة البلاصة
      </div>

      <div class="upload-small">
        JPG / PNG / WEBP — صورة واحدة
      </div>

    </label>

    <input
      id="photo"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >


    <!-- preview -->

    <div id="preview" class="preview">

      <img id="previewImg" src="" alt="الصورة">

      <button
        type="button"
        class="remove"
        onclick="removePhoto()">

        ❌ حذف الصورة

      </button>

    </div>


    <!-- القياسات -->

    <label>
      📏 القياسات التقريبية
    </label>

    <input
      id="dimensions"
      type="text"
      placeholder="مثال: 3.20م × 2.80م"
    >


    <!-- الستايل -->

    <label>
      🎨 الستايل اللي بغيتي
    </label>

    <select id="style">

      <option value="مودرن">
        مودرن
      </option>

      <option value="مودرن فاخر">
        مودرن فاخر
      </option>

      <option value="كلاسيك">
        كلاسيك
      </option>

      <option value="بسيط">
        بسيط
      </option>

      <option value="خشب طبيعي">
        خشب طبيعي
      </option>

      <option value="مازال ماعرفتش">
        مازال ماعرفتش
      </option>

    </select>


    <!-- اللون -->

    <label>
      🎨 اللون المفضل
    </label>

    <input
      id="color"
      type="text"
      placeholder="مثال: أبيض وخشب نوايي"
    >


    <!-- الميزانية -->

    <label>
      💰 الميزانية التقريبية
    </label>

    <select id="budget">

      <option value="مازال ماحددتش">
        مازال ماحددتش
      </option>

      <option value="أقل من 5000 درهم">
        أقل من 5,000 درهم
      </option>

      <option value="5000 - 10000 درهم">
        5,000 - 10,000 درهم
      </option>

      <option value="10000 - 20000 درهم">
        10,000 - 20,000 درهم
      </option>

      <option value="أكثر من 20000 درهم">
        أكثر من 20,000 درهم
      </option>

    </select>


    <!-- ملاحظات -->

    <label>
      📝 ملاحظات إضافية
    </label>

    <textarea
      id="notes"
      placeholder="مثلاً: بغيت بلاصة للتلفاز، إضاءة داخلية، لون معين..."
    ></textarea>


    <!-- إرسال -->

    <button
      id="sendBtn"
      class="send"
      disabled>

      📲 إرسال الطلب عبر WhatsApp

    </button>


    <div
      id="status"
      class="status">
    </div>


    <div class="note">

      <strong>كيفاش كيخدم؟</strong>

      <br>

      1. اختار صورة ديال البلاصة.

      <br>

      2. عمر المعلومات.

      <br>

      3. الصورة كتترفع بشكل آمن إلى Cloudinary.

      <br>

      4. منين كتنجح عملية الرفع، كيتحل WhatsApp.

      <br>

      5. كتوصل الرسالة عندك ومعاها رابط الصورة الأصلية.

    </div>

  </div>

</div>


<script>

/* ==================================================
   الإعدادات
================================================== */

/*
  ⚠️ بدل هاد الرقم برقم WhatsApp ديالك

  المغرب:
  212 + الرقم بلا 0

  مثال:
  0612345678

  كيولي:
  212612345678
*/

const WHATSAPP_NUMBER = "212600000000";


/*
  معلومات Cloudinary ديالك
*/

const CLOUD_NAME = "rhao0lli";

const UPLOAD_PRESET = "samemdecork_images";


/* ==================================================
   العناصر
================================================== */

const photoInput =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");

const previewImg =
  document.getElementById("previewImg");

const sendBtn =
  document.getElementById("sendBtn");

const statusBox =
  document.getElementById("status");

let selectedFile = null;


/* ==================================================
   اختيار الصورة
================================================== */

photoInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file){

      removePhoto();

      return;

    }


    /* التحقق من نوع الصورة */

    if(!file.type.startsWith("image/")){

      showError(
        "الملف اللي اخترتي ماشي صورة."
      );

      this.value = "";

      return;

    }


    /* الحد الأقصى 10MB */

    if(file.size > 10 * 1024 * 1024){

      showError(
        "الصورة كبيرة بزاف. اختار صورة أقل من 10MB."
      );

      this.value = "";

      return;

    }


    selectedFile = file;


    /* عرض الصورة */

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        previewImg.src =
          e.target.result;

        preview.style.display =
          "block";

      };

    reader.readAsDataURL(file);


    sendBtn.disabled =
      false;

    hideStatus();

  }
);


/* ==================================================
   حذف الصورة
================================================== */

function removePhoto(){

  selectedFile = null;

  photoInput.value = "";

  previewImg.src = "";

  preview.style.display = "none";

  sendBtn.disabled = true;

}


/* ==================================================
   رفع الصورة إلى Cloudinary
================================================== */

async function uploadToCloudinary(file){

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  /*
    نخلي الصور ديال طلبات الزبائن
    في مجلد خاص
  */

  formData.append(
    "folder",
    "samemdecork/client-requests"
  );


  const response =
    await fetch(

      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

      {
        method:"POST",
        body:formData
      }

    );


  const data =
    await response.json();


  if(!response.ok){

    console.error(
      "Cloudinary error:",
      data
    );

    throw new Error(
      data.error?.message ||
      "فشل رفع الصورة"
    );

  }


  return data;

}


/* ==================================================
   إرسال الطلب
================================================== */

sendBtn.addEventListener(
  "click",
  async function(){

    if(!selectedFile){

      showError(
        "اختار الصورة ديال البلاصة أولاً."
      );

      return;

    }


    /*
      منع الضغط أكثر من مرة
    */

    sendBtn.disabled = true;


    showLoading(
      "⏳ كنرفع الصورة...<br>باقي غير شوية."
    );


    try{

      /* ==========================
         1 — رفع الصورة
      ========================== */

      const cloudinary =
        await uploadToCloudinary(
          selectedFile
        );


      /*
        هادا هو الرابط الحقيقي
        للصورة في Cloudinary
      */

      const imageUrl =
        cloudinary.secure_url;


      console.log(
        "Cloudinary URL:",
        imageUrl
      );


      /* ==========================
         2 — جمع المعلومات
      ========================== */

      const section =
        document.getElementById(
          "section"
        ).value;


      const dimensions =
        document.getElementById(
          "dimensions"
        ).value ||
        "ماحددهاش";


      const style =
        document.getElementById(
          "style"
        ).value;


      const color =
        document.getElementById(
          "color"
        ).value ||
        "ماحددش";


      const budget =
        document.getElementById(
          "budget"
        ).value;


      const notes =
        document.getElementById(
          "notes"
        ).value ||
        "ماكايناش";


      /* ==========================
         3 — إنشاء رسالة WhatsApp
      ========================== */

      const message =

`السلام عليكم 👋

عندي طلب تصميم جديد من موقع صمم ديكورك.

🏠 القسم:
${section}

📏 القياسات:
${dimensions}

🎨 الستايل:
${style}

🎨 اللون:
${color}

💰 الميزانية:
${budget}

📝 ملاحظات:
${notes}

📸 صورة البلاصة:
${imageUrl}

بغيت نشوف التصميم والثمن التقريبي.`;


      /* ==========================
         4 — فتح WhatsApp
      ========================== */

      const whatsappUrl =
        `https://wa.me/${+212754300706}?text=${encodeURIComponent(message)}`;


      showSuccess(
        "✅ الصورة ترفعات بنجاح.<br>غادي يتحل WhatsApp دابا."
      );


      /*
        نعطي المتصفح شوية وقت
        باش يبين النجاح
      */

      setTimeout(
        function(){

          window.location.href =
            whatsappUrl;

        },
        700
      );


    }catch(error){

      console.error(error);


      showError(
        "❌ ماقدرناش نرفعو الصورة.<br><br>" +
        "تأكد من Cloudinary Upload Preset وأنه Unsigned."
      );


      sendBtn.disabled =
        false;

    }

  }
);


/* ==================================================
   رسائل الحالة
================================================== */

function showLoading(message){

  statusBox.className =
    "status loading";

  statusBox.innerHTML =
    message;

  statusBox.style.display =
    "block";

}


function showSuccess(message){

  statusBox.className =
    "status success";

  statusBox.innerHTML =
    message;

  statusBox.style.display =
    "block";

}


function showError(message){

  statusBox.className =
    "status error";

  statusBox.innerHTML =
    message;

  statusBox.style.display =
    "block";

}


function hideStatus(){

  statusBox.style.display =
    "none";

}

</script>

</body>
</html>
