<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>صمم ديكورك | صمم مطبخك</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f1eb;
  color:#171717;
  line-height:1.7;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================
HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#111;
  color:#fff;
  padding:14px 4%;
  box-shadow:0 4px 25px #0005;
}

.header-inner{
  width:min(1200px,94%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#c8a878;
}

.header-small{
  color:#aaa;
  font-size:12px;
}

.home-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#c8a878;
  color:#111;
  text-decoration:none;
  padding:9px 15px;
  border-radius:12px;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
}


/* =========================
HERO
========================= */

.hero{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  padding:50px 20px;

  background:
    linear-gradient(90deg,#000b,#0007),
    url("https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&w=1800&q=85")
    center/cover;
}

.hero-content{
  max-width:800px;
}

.hero-badge{
  display:inline-block;
  border:1px solid #ffffff55;
  background:#ffffff12;
  padding:7px 15px;
  border-radius:30px;
  font-size:13px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(30px,6vw,55px);
  line-height:1.25;
  margin-bottom:12px;
}

.hero p{
  color:#ddd;
  font-size:15px;
  max-width:700px;
  margin:auto;
}


/* =========================
CONTAINER
========================= */

.container{
  width:min(1150px,92%);
  margin:30px auto 80px;
}


/* =========================
CLIENT
========================= */

.client-box{
  background:#111;
  color:#fff;
  border-radius:22px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 10px 35px #0002;
}

.client-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:5px;
}

.client-sub{
  color:#aaa;
  font-size:13px;
  margin-bottom:20px;
}

.client-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.client-field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#ddd;
}

.client-field input{
  width:100%;
  border:1px solid #ffffff22;
  background:#ffffff0d;
  color:#fff;
  padding:13px;
  border-radius:12px;
  outline:none;
}

.required{
  color:#d8b777;
}


/* =========================
PROGRESS
========================= */

.progress-wrap{
  background:#fff;
  padding:16px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 6px 25px #0000000b;
}

.progress{
  height:7px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#b29368;
  transition:.4s;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:8px;
  font-size:12px;
  color:#777;
}


/* =========================
SECTIONS
========================= */

.section{
  background:#fff;
  border-radius:22px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 7px 30px #0000000b;
  scroll-margin-top:90px;
}

.section-head{
  margin-bottom:20px;
}

.section-head small{
  color:#b29368;
  font-weight:900;
}

.section-head h2{
  font-size:25px;
  margin:3px 0;
}

.section-head p{
  color:#777;
  font-size:13px;
}


/* =========================
OPTIONS
========================= */

.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:13px;
}

.option{
  position:relative;
  border:2px solid #eee;
  background:#fafafa;
  border-radius:17px;
  min-height:105px;
  padding:14px;
  text-align:center;
  transition:.2s;
  overflow:hidden;
}

.option:hover{
  border-color:#c8a878;
  transform:translateY(-2px);
}

.option.selected{
  border-color:#a7865a;
  background:#fbf7ef;
  box-shadow:0 0 0 3px #c8a87822;
}

.option.selected::after{
  content:"✓";
  position:absolute;
  top:7px;
  right:7px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#a7865a;
  color:#fff;
  line-height:24px;
  font-size:13px;
  font-weight:bold;
}

.option-title{
  font-weight:900;
  font-size:14px;
}

.option-desc{
  display:block;
  color:#888;
  font-size:11px;
  margin-top:3px;
}


/* =========================
VISUALS
========================= */

.visual{
  width:90px;
  height:65px;
  margin:0 auto 10px;
  position:relative;
}

.visual span{
  position:absolute;
  display:block;
  background:#806746;
  border-radius:4px;
}

.v-l span:nth-child(1){
  width:65px;
  height:10px;
  bottom:8px;
  right:10px;
}

.v-l span:nth-child(2){
  width:10px;
  height:48px;
  bottom:8px;
  right:10px;
}

.v-u span:nth-child(1){
  width:65px;
  height:10px;
  bottom:8px;
  right:13px;
}

.v-u span:nth-child(2){
  width:10px;
  height:48px;
  bottom:8px;
  right:13px;
}

.v-u span:nth-child(3){
  width:10px;
  height:48px;
  bottom:8px;
  left:12px;
}

.v-line span:nth-child(1){
  width:76px;
  height:10px;
  bottom:8px;
  right:7px;
}

.v-two span:nth-child(1){
  width:65px;
  height:9px;
  bottom:13px;
  right:12px;
  transform:rotate(-12deg);
}

.v-two span:nth-child(2){
  width:65px;
  height:9px;
  top:12px;
  right:12px;
  transform:rotate(12deg);
}

.v-island span:nth-child(1){
  width:68px;
  height:9px;
  bottom:8px;
  right:11px;
}

.v-island span:nth-child(2){
  width:40px;
  height:9px;
  bottom:27px;
  right:25px;
  background:#b29368;
}


/* =========================
CABINET
========================= */

.cabinet{
  width:90px;
  height:65px;
  margin:0 auto 10px;
  position:relative;
}

.cabinet-body{
  position:absolute;
  inset:8px 10px;
  border-radius:5px;
  background:#c4a786;
  box-shadow:inset 0 0 0 2px #0002;
}

.cabinet-line{
  position:absolute;
  height:2px;
  background:#0003;
  left:15px;
  right:15px;
  top:31px;
}

.cabinet-handle{
  position:absolute;
  width:3px;
  height:16px;
  background:#555;
  top:25px;
  right:28px;
}


/* =========================
UPPER
========================= */

.upper{
  width:100px;
  height:65px;
  margin:auto;
  position:relative;
}

.upper-box{
  position:absolute;
  width:29px;
  height:45px;
  top:8px;
  background:#c1a989;
  border:2px solid #8e775b;
  border-radius:3px;
}

.upper-box:nth-child(1){
  right:4px;
}

.upper-box:nth-child(2){
  right:36px;
}

.upper-box:nth-child(3){
  right:68px;
}

.upper-ceiling{
  border-radius:2px;
  height:8px;
  position:absolute;
  right:2px;
  left:2px;
  bottom:3px;
  background:#7b6549;
}

.upper-cap{
  position:absolute;
  right:2px;
  left:2px;
  top:5px;
  height:10px;
  background:#6f5a43;
  border-radius:2px;
}


/* =========================
DOORS
========================= */

.door{
  width:80px;
  height:65px;
  margin:auto;
  position:relative;
}

.door-panel{
  position:absolute;
  width:48px;
  height:57px;
  top:4px;
  right:16px;
  border-radius:5px;
  border:4px solid #8b7252;
  background:#cbb18f;
}

.door-panel.modern{
  border:0;
  background:linear-gradient(135deg,#e4d9c9,#bfa889);
}

.door-panel.push{
  border:0;
  background:#222;
}

.door-panel.glass{
  border:3px solid #202020;
  background:linear-gradient(135deg,#b9d2d855,#eef9ff99);
}

.door-panel.frame{
  border:5px solid #222;
  background:#d7d0c5;
}

.door-handle{
  position:absolute;
  width:3px;
  height:15px;
  background:#555;
  top:25px;
  right:26px;
}


/* =========================
COUNTERS
========================= */

.counter-options{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.counter-option{
  min-height:60px;
  border:2px solid #eee;
  background:#fafafa;
  border-radius:13px;
  font-weight:900;
  font-size:17px;
}

.counter-option.selected{
  background:#fbf7ef;
  border-color:#a7865a;
  color:#8d7047;
}


/* =========================
SURFACE
========================= */

.surface{
  height:75px;
  width:110px;
  margin:0 auto 10px;
  border-radius:8px;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 10px #0002;
}

.surface-quartz{
  background:linear-gradient(120deg,#eee,#fff,#ddd,#fff,#eee);
}

.surface-granite{
  background:
    radial-gradient(circle at 20% 30%,#222 0 2px,transparent 3px),
    radial-gradient(circle at 70% 60%,#777 0 2px,transparent 3px),
    radial-gradient(circle at 40% 80%,#333 0 2px,transparent 3px),
    #555;
}

.surface-marble{
  background:
    linear-gradient(120deg,transparent 42%,#aaa 43%,transparent 45%),
    linear-gradient(45deg,transparent 55%,#999 56%,transparent 58%),
    #f4f1e8;
}

.surface-dekton{
  background:linear-gradient(135deg,#252525,#666,#292929);
}

.surface-compact{
  background:repeating-linear-gradient(
    90deg,
    #282828 0,
    #282828 7px,
    #353535 8px,
    #353535 14px
  );
}

.surface-normal{
  background:#c3a27d;
}


/* =========================
COLOR
========================= */

.color-circle{
  width:62px;
  height:62px;
  margin:0 auto 10px;
  border-radius:50%;
  box-shadow:inset 0 0 0 2px #0002,0 4px 10px #0002;
}

.c-white{background:#eee9df}
.c-cappuccino{background:#b99b7a}
.c-beige{background:#d4c2a9}
.c-grey{background:#888883}
.c-black{background:#181818}
.c-green{background:#64705d}
.c-navy{background:#29343c}

.c-wood{
  background:repeating-linear-gradient(
    90deg,
    #6d4328 0,
    #805133 5px,
    #9b6742 10px,
    #6c4128 15px
  );
}


/* =========================
ACCESSORIES
========================= */

.accessory{
  min-height:125px;
}

.accessory-icon{
  width:65px;
  height:55px;
  margin:0 auto 8px;
  position:relative;
}

.icon-drawer{
  border:4px solid #777;
  border-radius:5px;
  width:55px;
  height:42px;
  margin:auto;
  position:relative;
  top:6px;
}

.icon-drawer::after{
  content:"";
  position:absolute;
  width:25px;
  height:4px;
  background:#444;
  left:11px;
  top:14px;
  border-radius:5px;
}

.icon-corner{
  width:48px;
  height:48px;
  margin:auto;
  border-left:7px solid #806746;
  border-bottom:7px solid #806746;
  transform:rotate(-45deg);
}

.icon-spice{
  display:flex;
  justify-content:center;
  align-items:end;
  gap:4px;
  height:55px;
}

.icon-spice span{
  width:12px;
  height:30px;
  background:#b29368;
  border-radius:3px;
}

.icon-bottle{
  width:22px;
  height:45px;
  background:#777;
  border-radius:5px;
  margin:auto;
  position:relative;
}

.icon-bottle::before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  top:-8px;
  left:6px;
  background:#555;
}

.icon-led{
  width:70px;
  height:8px;
  background:#e7d39f;
  border-radius:20px;
  margin:20px auto;
  box-shadow:0 0 18px #d6b85d;
}


/* =========================
MEASUREMENTS
========================= */

.measure-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.field label{
  display:block;
  font-weight:900;
  margin-bottom:7px;
  font-size:13px;
}

.field input{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}


/* =========================
BUDGET
========================= */

.budget-box{
  background:#151515;
  color:#fff;
  border-radius:20px;
  padding:25px;
}

.budget-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.budget-value{
  color:#d3b483;
  font-size:28px;
  font-weight:900;
}

.budget-level{
  display:inline-block;
  margin-top:10px;
  padding:5px 13px;
  border-radius:20px;
  background:#ffffff12;
  color:#ddd;
  font-size:12px;
}

input[type=range]{
  width:100%;
  margin:20px 0 5px;
  accent-color:#b29368;
}


/* =========================
UPLOAD
========================= */

.upload-box{
  border:2px dashed #d4c7b4;
  background:#fbf9f5;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
}

.upload-icon{
  font-size:40px;
  margin-bottom
