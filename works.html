<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>أعمالنا | صمم ديكورك</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#0b110e;
color:#fff;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

header{
background:#111a15;
padding:18px 0;
border-bottom:1px solid #303936;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
}

.logo span{
color:#cfd2d4;
}

.back{
color:#cfd2d4;
text-decoration:none;
}

.hero{
padding:75px 0 45px;
text-align:center;
}

.hero small{
color:#cfd2d4;
letter-spacing:2px;
}

.hero h1{
font-size:clamp(35px,6vw,60px);
margin:8px 0;
}

.hero p{
color:#9da5a1;
}

.filters{
display:flex;
justify-content:center;
gap:8px;
flex-wrap:wrap;
margin:25px 0 40px;
}

.filter{
border:1px solid #3a4540;
background:#111a15;
color:#fff;
padding:10px 17px;
border-radius:30px;
cursor:pointer;
font-family:inherit;
}

.filter.active{
background:#cfd2d4;
color:#17211c;
}

.grid{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:18px;
padding-bottom:80px;
}

.card{
background:#111a15;
border:1px solid #29332e;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#cfd2d4;
}

.card img{
width:100%;
height:290px;
object-fit:cover;
display:block;
}

.info{
padding:15px;
}

.info h3{
margin-bottom:4px;
}

.info p{
color:#929b96;
font-size:13px;
}

.empty{
text-align:center;
color:#929b96;
padding:50px 0;
}

.viewer{
position:fixed;
inset:0;
background:#000e;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.viewer.show{
display:flex;
}

.viewer img{
max-width:95vw;
max-height:90vh;
object-fit:contain;
}

.close{
position:absolute;
top:20px;
left:25px;
font-size:32px;
cursor:pointer;
color:#fff;
}

@media(max-width:850px){

.grid{
grid-template-columns:
repeat(2,1fr);
}

}

@media(max-width:550px){

.grid{
grid-template-columns:1fr;
}

.card img{
height:260px;
}

}

</style>

</head>

<body>

<header>

<div class="wrap nav">

<div class="logo">
صمم <span>ديكورك</span>
</div>

<a
href="index.html"
class="back">

الرئيسية

</a>

</div>

</header>


<section class="hero">

<div class="wrap">

<small>
REAL PROJECTS
</small>

<h1>
أعمالنا
</h1>

<p>
شوف المشاريع الحقيقية اللي خدمناها
</p>

<div class="filters">

<button
class="filter active"
data-category="all">

الكل

</button>

<button
class="filter"
data-category="kitchen">

مطابخ

</button>

<button
class="filter"
data-category="dressing">

Dressing

</button>

<button
class="filter"
data-category="wardrobes">

بلاكرات

</button>

<button
class="filter"
data-category="salon">

صالونات

</button>

<button
class="filter"
data-category="bedroom">

غرف النوم

</button>

<button
class="filter"
data-category="tv">

Meuble TV

</button>

<button
class="filter"
data-category="tapisserie">

طابيسري

</button>

</div>

</div>

</section>


<main>

<div class="wrap">

<div
id="grid"
class="grid">

<div class="empty">
جاري تحميل الأعمال...
</div>

</div>

</div>

</main>


<div
id="viewer"
class="viewer"
onclick="closeViewer()">

<div
class="close">

×
</div>

<img
id="viewerImg"
src=""
alt="">

</div>


<script>

let works=[];

let currentCategory="all";


async function loadWorks(){

const grid =
document.getElementById("grid");


try{

const response =
await fetch("/api/works");


if(!response.ok){

throw new Error();

}


works =
await response.json();


render();


}catch(error){

console.error(error);

grid.innerHTML=`

<div class="empty">

وقع مشكل في تحميل الصور.
<br>
حاول تعاود تحديث الصفحة.

</div>

`;

}

}


function render(){

const grid =
document.getElementById("grid");


const filtered =
currentCategory === "all"

? works

: works.filter(
work =>
work.category === currentCategory
);


if(!filtered.length){

grid.innerHTML=`

<div class="empty">

مازال ما كايناش أعمال فهاد القسم.

</div>

`;

return;

}


grid.innerHTML="";


filtered.forEach(work=>{

const card =
document.createElement("article");

card.className="card";


card.innerHTML=`

<img
src="${safe(work.image)}"
alt="صمم ديكورك"
loading="lazy">

<div class="info">

<h3>
${safe(work.title)}
</h3>

<p>
${categoryName(work.category)}
</p>

</div>

`;


card.onclick=function(){

openViewer(work.image);

};


grid.appendChild(card);

});

}


function categoryName(category){

const names={

kitchen:"المطابخ",

dressing:"Dressing",

wardrobes:"البلاكرات",

salon:"الصالونات",

bedroom:"غرف النوم",

tv:"Meuble TV",

tapisserie:"طابيسري"

};

return names[category] || category;

}


document
.querySelectorAll(".filter")
.forEach(button=>{

button.onclick=function(){

document
.querySelectorAll(".filter")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

currentCategory =
button.dataset.category;

render();

};

});


function openViewer(url){

document
.getElementById("viewerImg")
.src=url;

document
.getElementById("viewer")
.classList.add("show");

}


function closeViewer(){

document
.getElementById("viewer")
.classList.remove("show");

}


function safe(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


loadWorks();

</script>

</body>

</html>
