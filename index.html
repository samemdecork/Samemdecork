<!-- =========================================================
     SAMEM DECOR — FINAL PATCH
     لا يغير التصميم ولا الصور الموجودة
     يصلح التنقل + اللغة + أزرار الطلب
========================================================= -->

<script>
(function () {
  "use strict";

  /* ===============================
     اللغة
  =============================== */

  const translations = {
    ar: {
      home: "صمم ديكورك",
      works: "أعمالنا",
      partners: "شركاؤنا",
      shop: "أكسيسوارات",
      project: "مشروعك معنا",
      start: "ابدأ التصميم",
      viewWorks: "شوف أعمالنا",
      choose: "شنو بغيتي تصاوب؟",
      easy: "طلب مختصر",
      detailed: "اختيار دقيق",
      width: "العرض",
      length: "الطول",
      height: "العلو",
      budget: "الميزانية",
      notes: "ملاحظاتك",
      next: "التالي",
      back: "رجوع",
      submit: "إرسال الطلب"
    },

    fr: {
      home: "Samem Decor",
      works: "Nos réalisations",
      partners: "Nos partenaires",
      shop: "Accessoires",
      project: "Votre projet",
      start: "Commencer",
      viewWorks: "Voir nos réalisations",
      choose: "Que souhaitez-vous réaliser ?",
      easy: "Demande rapide",
      detailed: "Choix détaillé",
      width: "Largeur",
      length: "Longueur",
      height: "Hauteur",
      budget: "Budget",
      notes: "Vos remarques",
      next: "Suivant",
      back: "Retour",
      submit: "Envoyer la demande"
    }
  };

  let currentLang =
    localStorage.getItem("samemdec_lang") || "ar";

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("samemdec_lang", lang);

    document.documentElement.lang =
      lang === "fr" ? "fr" : "ar";

    document.documentElement.dir =
      lang === "fr" ? "ltr" : "rtl";

    document.body.classList.toggle(
      "lang-fr",
      lang === "fr"
    );

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;

      if (
        translations[lang] &&
        translations[lang][key]
      ) {
        el.textContent =
          translations[lang][key];
      }
    });

    const btn =
      document.querySelector("[data-language-toggle]");

    if (btn) {
      btn.textContent =
        lang === "fr"
          ? "العربية"
          : "Français";
    }
  }

  window.samemdecLanguage = setLanguage;


  /* ===============================
     التنقل السلس داخل الصفحة
  =============================== */

  function goTo(id) {
    const target =
      document.getElementById(id);

    if (!target) return;

    target.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  window.samemdecGo = goTo;


  /* ===============================
     أزرار الصفحة الرئيسية
  =============================== */

  document.addEventListener("click", function (e) {

    const link =
      e.target.closest("[data-go]");

    if (link) {
      e.preventDefault();

      const id =
        link.dataset.go;

      goTo(id);
      return;
    }


    /* زر اللغة */

    const languageButton =
      e.target.closest("[data-language-toggle]");

    if (languageButton) {
      e.preventDefault();

      setLanguage(
        currentLang === "ar"
          ? "fr"
          : "ar"
      );

      return;
    }


    /* الطلب المختصر */

    const quick =
      e.target.closest("[data-request='quick']");

    if (quick) {
      e.preventDefault();

      const configurator =
        document.getElementById(
          "project-form"
        ) ||
        document.getElementById(
          "configurator"
        ) ||
        document.getElementById(
          "request"
        );

      if (configurator) {
        configurator.dataset.mode =
          "quick";

        configurator.scrollIntoView({
          behavior: "smooth"
        });
      }

      return;
    }


    /* الاختيار الدقيق */

    const detailed =
      e.target.closest(
        "[data-request='detailed']"
      );

    if (detailed) {
      e.preventDefault();

      const configurator =
        document.getElementById(
          "project-form"
        ) ||
        document.getElementById(
          "configurator"
        ) ||
        document.getElementById(
          "request"
        );

      if (configurator) {
        configurator.dataset.mode =
          "detailed";

        configurator.scrollIntoView({
          behavior: "smooth"
        });
      }

      return;
    }

  });


  /* ===============================
     منع الأزرار الفارغة من عدم الاستجابة
  =============================== */

  document.querySelectorAll(
    "button[data-section]"
  ).forEach(button => {

    button.addEventListener(
      "click",
      function () {

        const section =
          this.dataset.section;

        if (section) {
          goTo(section);
        }

      }
    );

  });


  /* ===============================
     اختيار الأقسام
  =============================== */

  document.querySelectorAll(
    "[data-category]"
  ).forEach(card => {

    card.addEventListener(
      "click",
      function () {

        const category =
          this.dataset.category;

        localStorage.setItem(
          "samemdec_category",
          category
        );

        const form =
          document.getElementById(
            "project-form"
          ) ||
          document.getElementById(
            "configurator"
          ) ||
          document.getElementById(
            "request"
          );

        if (form) {

          form.dataset.category =
            category;

          form.scrollIntoView({
            behavior: "smooth"
          });

        }

      }
    );

  });


  /* ===============================
     تفعيل الصور الموجودة
     بدون تغيير مصادرها
  =============================== */

  document.querySelectorAll(
    "img"
  ).forEach(img => {

    img.loading = "lazy";

    img.addEventListener(
      "error",
      function () {

        /*
          لا نحذف الصورة ولا نبدل التصميم.
          فقط نخلي العنصر محافظ على مكانه.
        */

        this.classList.add(
          "image-load-error"
        );

      }
    );

  });


  /* ===============================
     بداية التشغيل
  =============================== */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      function () {
        setLanguage(currentLang);
      }
    );

  } else {

    setLanguage(currentLang);

  }

})();
</script>


<style>

/* =========================================================
   إصلاحات خفيفة فقط
   لا تغيير للهوية البصرية
========================================================= */

html {
  scroll-behavior: smooth;
}

[data-go],
[data-request],
[data-category],
[data-language-toggle] {
  cursor: pointer;
}

.image-load-error {
  background:
    linear-gradient(
      135deg,
      #eeeeee,
      #d8d8d8
    );
}

/* اللغة الفرنسية */

.lang-fr {
  direction: ltr;
}

.lang-fr input,
.lang-fr textarea,
.lang-fr select {
  direction: ltr;
  text-align: left;
}

/* اللغة العربية */

html[dir="rtl"] input,
html[dir="rtl"] textarea,
html[dir="rtl"] select {
  text-align: right;
}

</style>
