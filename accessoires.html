<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الإكسسوارات والمبيعات | صمم ديكورك</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f4f2;
color:#17211c;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

header{
height:72px;
background:#0c120f;
display:flex;
align-items:center;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:25px;
font-weight:900;
color:white;
}

.logo span{
color:#cfd2d4;
}

.back{
background:#cfd2d4;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
}

.hero{
background:#17211c;
color:white;
padding:65px 0;
text-align:center;
}

.hero small{
color:#cfd2d4;
letter-spacing:3px;
}

.hero h1{
font-size:clamp(35px,6vw,58px);
margin:8px 0;
}

.hero p{
color:#cbd1ce;
}

.products{
padding:60px 0 90px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.product{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 8px 25px #0001;
}

.product img{
width:100%;
height:240px;
object-fit:cover;
}

.info{
padding:18px;
}

.info h3{
font-size:20px;
margin-bottom:5px;
}

.description{
font-size:14px;
color:#777;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:900;
margin-bottom:15px;
}

.order{
display:block;
background:#17211c;
color:white;
text-align:center;
padding:11px;
border-radius:6px;
font-weight:bold;
}

.loading,
.empty{
text-align:center;
background:white;
padding:50px;
border-radius:10px;
color:#777;
}

footer{
background:#0e1511;
color:#999;
text-align:center;
padding:30px;
}

footer strong{
color:#cfd2d4;
}

@media(max-width:900px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:550px){
.grid{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<header>

<div class="wrap nav">

<a href="index.html" class="logo">
صمم <span>ديكورك</span>
</a>

<a href="index.html" class="back">
الرئيسية
</a>

</div>

</header>

<section class="hero">

<div class="wrap">

<small>SHOP</small>

<h1>الإكسسوارات والمبيعات</h1>

<p>
منتجات وتجهيزات للمشاريع والديكور
</p>

</div>

</section>

<section class="products">

<div class="wrap">

<div id="loading" class="loading">
جاري تحميل المنتجات...
</div>

<div id="grid" class="grid"></div>

<div id="empty" class="empty" style="display:none">
مازال ما تزاد حتى منتج.
</div>

</div>

</section>

<footer>

<strong>صمم ديكورك</strong> © 2026

<br>

جميع الحقوق محفوظة — Hamza Chtaibi

</footer>

<script>

async function loadProducts(){

const loading=document.getElementById("loading");
const grid=document.getElementById("grid");
const empty=document.getElementById("empty");

try{

const response=
await fetch("/api/gallery?type=products");

const data=await response.json();

loading.style.display="none";

if(!data.images || data.images.length===0){

empty.style.display="block";
return;

}

data.images.forEach(image=>{

const name=
image.public_id
.split("/")
.pop()
.replace(/[-_]/g," ");

const card=document.createElement("div");

card.className="product";

card.innerHTML=`

<img
src="${image.url}"
alt="${name}"
loading="lazy"
>

<div class="info">

<h3>${name}</h3>

<div class="description">
منتج متوفر حسب الطلب
</div>

<div class="price">
الثمن عند الطلب
</div>

<a
class="order"
href="https://wa.me/212000000000?text=${encodeURIComponent("سلام، بغيت نسول على المنتج: "+name)}"
target="_blank">

سول على الثمن

</a>

</div>

`;

grid.appendChild(card);

});

}catch(error){

loading.style.display="none";

empty.style.display="block";

empty.textContent=
"وقع مشكل في تحميل المنتجات.";

}

}

loadProducts();

</script>

</body>

</html>
