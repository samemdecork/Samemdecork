<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أعمالنا | صمم ديكورك</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f4f2;
color:#17211c;
line-height:1.7;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

/* HEADER */

header{
height:72px;
background:#0c120f;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 20px #0004;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
color:#fff;
}

.logo span{
color:#cfd2d4;
}

.back{
background:#cfd2d4;
color:#17211c;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
transition:.2s;
}

.back:hover{
transform:translateY(-2px);
}

/* HERO */

.hero{
padding:70px 0 45px;
text-align:center;
background:#17211c;
color:#fff;
}

.hero small{
color:#cfd2d4;
letter-spacing:3px;
font-weight:bold;
}

.hero h1{
font-size:clamp(35px,6vw,60px);
margin:8px 0;
}

.hero p{
color:#cbd1ce;
font-size:16px;
}

/* GALLERY */

.gallery{
padding:60px 0 90px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

/* CARD */

.card{
height:280px;
background:#ddd;
border-radius:10px;
overflow:hidden;
position:relative;
box-shadow:0 8px 25px #0001;
cursor:pointer;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.5s;
}

.card:hover img{
transform:scale(1.06);
}

/* LOADING */

.loading{
text-align:center;
padding:60px 20px;
font-weight:bold;
font-size:16px;
}

/* EMPTY */

.empty{
display:none;
text-align:center;
padding:60px 20px;
background:#fff;
border-radius:10px;
color:#777;
}

/* ERROR */

.error{
display:none;
text-align:center;
padding:30px 20px;
background:#fff;
border-radius:10px;
color:#a33;
}

/* FOOTER */

footer{
background:#0e1511;
color:#999;
padding:30px;
text-align:center;
}

footer strong{
color:#cfd2d4;
}

/* IMAGE VIEWER */

.viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:5000;
align-items:center;
justify-content:center;
padding:20px;
}

.viewer img{
max-width:95%;
max-height:90vh;
object-fit:contain;
border-radius:8px;
}

.close{
position:absolute;
top:20px;
right:25px;
width:45px;
height:45px;
border:0;
border-radius:50%;
background:#fff;
color:#17211c;
font-size:28px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.gallery{
padding:40px 0 70px;
}

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
height:220px;
}

.hero{
padding:55px 0 35px;
}

}

</p></div></section><!-- GALLERY --><section class="gallery"><div class="wrap"><div id="loading" class="loading">

</div><div id="gallery" class="grid"></div></div></section><!-- IMAGE VIEWER --><div id="viewer" class="viewer"><button

onclick="closeViewer()">

</button>

</footer><script>

/* ==========================================
   تحميل الصور من Cloudinary
   عن طريق API
========================================== */

async function loadWorks(){

const loading =
document.getElementById("loading");

const gallery =
document.getElementById("gallery");

const empty =
document.getElementById("empty");

const errorBox =
document.getElementById("error");

try{

const response =
await fetch("/api/gallery",{
cache:"no-store"
});

if(!response.ok){

throw new Error(
"API returned " + response.status
);

}

const data =
await response.json();

console.log(
"Cloudinary Gallery:",
data
);

loading.style.display="none";


if(
!data.success ||
!Array.isArray(data.images) ||
data.images.length===0
){

empty.style.display="block";

return;

}


/* عرض الصور */

data.images.forEach(image=>{

if(!image.url) return;


const card =
document.createElement("div");

card.className="card";


const img =
document.createElement("img");

img.src=image.url;

img.alt=
"مشروع من أعمال صمم ديكورك";

img.loading="lazy";


img.onerror=()=>{

card.remove();

};


card.appendChild(img);


/* فتح الصورة بالحجم الكبير */

card.onclick=()=>{

openViewer(image.url);

};


gallery.appendChild(card);

});


/* إذا تحيدات جميع الصور بسبب خطأ */

if(gallery.children.length===0){

empty.style.display="block";

}

}catch(error){

console.error(
"Works loading error:",
error
);

loading.style.display="none";

errorBox.style.display="block";

errorBox.textContent=
"وقع مشكل في تحميل الصور. حاول مرة أخرى.";

}

}


/* ==========================================
   IMAGE VIEWER
========================================== */

function openViewer(url){

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

viewerImage.src=url;

viewer.style.display="flex";

}


function closeViewer(){

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

viewer.style.display="none";

viewerImage.src="";

}


/* إغلاق بالضغط خارج الصورة */

document
.getElementById("viewer")
.addEventListener(
"click",
function(event){

if(event.target===this){

closeViewer();

}

});


/* إغلاق بزر ESC */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeViewer();

}

});


/* START */

loadWorks();

</script></body></html>
