<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>أعمالنا | صمم ديكورك</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f4f2;
color:#17211c;
line-height:1.7;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

/* HEADER */

header{
height:72px;
background:#0c120f;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 20px #0004;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
color:white;
}

.logo span{
color:#cfd2d4;
}

.back{
background:#cfd2d4;
color:#17211c;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
}

/* HERO */

.hero{
padding:70px 0 40px;
text-align:center;
background:#17211c;
color:white;
}

.hero small{
color:#cfd2d4;
letter-spacing:3px;
}

.hero h1{
font-size:clamp(35px,6vw,60px);
margin:8px 0;
}

.hero p{
color:#cbd1ce;
}

/* GALLERY */

.gallery{
padding:60px 0 90px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

/* CARD */

.card{
height:280px;
background:#ddd;
border-radius:10px;
overflow:hidden;
position:relative;
box-shadow:0 8px 25px #0001;
}

.card img,
.card video{
display:block;
width:100%;
height:100%;
object-fit:cover;
}

.card img{
transition:.5s;
}

.card:hover img{
transform:scale(1.06);
}

/* VIDEO */

.video-card{
background:#000;
}

.video-card video{
object-fit:cover;
}

/* VIDEO LABEL */

.video-label{
position:absolute;
top:12px;
right:12px;
z-index:5;
background:#17211c;
color:#fff;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* LOADING */

.loading{
text-align:center;
padding:50px;
font-weight:bold;
}

/* EMPTY */

.empty{
display:none;
text-align:center;
padding:60px 20px;
background:white;
border-radius:10px;
color:#777;
}

/* ERROR */

.error{
display:none;
text-align:center;
padding:25px 20px;
background:white;
border-radius:10px;
color:#a33;
margin-bottom:20px;
}

/* MOBILE */

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
height:220px;
}

}

</style></head><body><header><div class="wrap nav"><a href="index.html" class="logo">
صمم <span>ديكورك</span>
</a><a href="index.html" class="back">
الرئيسية
</a></div></header><!-- HERO --><section class="hero"><div class="wrap"><small>REAL PROJECTS</small>

<h1>أعمالنا</h1><p>
شوف المشاريع الحقيقية ديال صمم ديكورك
</p></div></section><!-- GALLERY --><section class="gallery"><div class="wrap"><div id="loading" class="loading">
جاري تحميل الأعمال...
</div><div id="error" class="error"></div><div id="empty" class="empty">
مازال ما تزادت حتى صورة أو فيديو.
</div><div id="gallery" class="grid"></div></div></section><footer><strong>صمم ديكورك</strong> © 2026

<br>جميع الحقوق محفوظة — Hamza Chtaibi

</footer><script>

/* ==========================================
   تحميل الصور من Cloudinary
   Folder:
   samemdecork/works
========================================== */

async function loadImages(){

try{

const response =
await fetch("/api/gallery?type=works");

if(!response.ok){
throw new Error("Gallery API error");
}

const data =
await response.json();

if(!data.success){
throw new Error(
data.error || "Cloudinary error"
);
}

return data.images || [];

}catch(error){

console.error(
"Images loading error:",
error
);

return [];

}

}


/* ==========================================
   تحميل الفيديوهات من Cloudinary
   Folder:
   samemdecork/works-videos
========================================== */

async function loadVideos(){

try{

const response =
await fetch("/api/videos");

if(!response.ok){
throw new Error("Videos API error");
}

const data =
await response.json();

if(!data.success){
throw new Error(
data.error || "Cloudinary error"
);
}

return data.videos || [];

}catch(error){

console.error(
"Videos loading error:",
error
);

return [];

}

}


/* ==========================================
   عرض الأعمال
========================================== */

async function loadWorks(){

const loading =
document.getElementById("loading");

const gallery =
document.getElementById("gallery");

const empty =
document.getElementById("empty");

const errorBox =
document.getElementById("error");

try{

const [images,videos] =
await Promise.all([
loadImages(),
loadVideos()
]);

loading.style.display="none";


/* إذا ماكاين لا صور لا فيديو */

if(
images.length===0 &&
videos.length===0
){

empty.style.display="block";

return;

}


/* ==========================================
   عرض الصور
========================================== */

images.forEach((image)=>{

const card =
document.createElement("div");

card.className="card";

const img =
document.createElement("img");

img.src=image.url;

img.alt=
"مشروع من أعمال صمم ديكورك";

img.loading="lazy";

card.appendChild(img);

gallery.appendChild(card);

});


/* ==========================================
   عرض الفيديوهات
========================================== */

videos.forEach((video)=>{

const card =
document.createElement("div");

card.className=
"card video-card";


const player =
document.createElement("video");

player.src=video.url;

player.controls=true;

player.playsInline=true;

player.preload="metadata";

player.setAttribute(
"aria-label",
"فيديو من أعمال صمم ديكورك"
);


const label =
document.createElement("div");

label.className="video-label";

label.textContent="VIDEO";


card.appendChild(player);

card.appendChild(label);

gallery.appendChild(card);

});


}catch(error){

console.error(
"Works loading error:",
error
);

loading.style.display="none";

errorBox.textContent=
"وقع مشكل في تحميل الأعمال.";

errorBox.style.display="block";

}

}


/* START */

loadWorks();

</script></body></html>
