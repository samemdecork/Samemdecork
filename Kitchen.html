<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111">
<title>صمم ديكورك | صمم مطبخك</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f3ef;
  color:#171717;
  line-height:1.7;
}

button,input{
  font-family:inherit;
}

.header{
  background:#111;
  color:white;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 20px #0002;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#c8a878;
}

.header-small{
  color:#bbb;
  font-size:13px;
}

.hero{
  background:
    linear-gradient(#0009,#0009),
    url("https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1800&q=85")
    center/cover;
  min-height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:50px 20px;
}

.hero h1{
  font-size:clamp(30px,5vw,52px);
  margin-bottom:10px;
}

.hero p{
  color:#ddd;
  max-width:700px;
  margin:auto;
}

.container{
  width:min(1150px,92%);
  margin:35px auto 70px;
}

.progress-wrap{
  background:white;
  padding:16px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 5px 25px #0000000b;
}

.progress{
  height:7px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#b29368;
  transition:.4s;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
  color:#777;
}

.section{
  background:white;
  border-radius:22px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 7px 30px #0000000b;
  scroll-margin-top:100px;
}

.section-head{
  margin-bottom:20px;
}

.section-head small{
  color:#b29368;
  font-weight:bold;
}

.section-head h2{
  font-size:25px;
  margin:3px 0;
}

.section-head p{
  color:#777;
  font-size:14px;
}

.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:13px;
}

.option{
  border:2px solid #eee;
  background:#fafafa;
  border-radius:16px;
  min-height:85px;
  padding:15px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  text-align:center;
}

.option:hover{
  transform:translateY(-2px);
  border-color:#c8a878;
}

.option.selected{
  border-color:#a7865a;
  background:#fbf7ef;
  box-shadow:0 0 0 3px #c8a87822;
}

.option.selected:after{
  content:"✓";
  position:absolute;
  top:7px;
  right:8px;
  background:#a7865a;
  color:white;
  width:23px;
  height:23px;
  border-radius:50%;
  line-height:23px;
  font-size:13px;
}

.option-title{
  font-weight:800;
}

.option-price{
  display:block;
  color:#a7865a;
  font-size:12px;
  margin-top:4px;
}

.shape-icon{
  width:65px;
  height:50px;
  margin:0 auto 8px;
  position:relative;
}

.shape-icon:before,
.shape-icon:after{
  content:"";
  position:absolute;
  background:#222;
  border-radius:3px;
}

.shape-l:before{
  width:50px;
  height:7px;
  bottom:8px;
  right:5px;
}

.shape-l:after{
  width:7px;
  height:42px;
  bottom:8px;
  right:5px;
}

.shape-u:before{
  width:50px;
  height:7px;
  bottom:8px;
  right:8px;
}

.shape-u:after{
  width:7px;
  height:42px;
  bottom:8px;
  right:8px;
  box-shadow:-43px 0 #222;
}

.shape-line:before{
  width:58px;
  height:7px;
  bottom:8px;
  right:3px;
}

.shape-two:before{
  width:45px;
  height:7px;
  bottom:8px;
  right:8px;
  transform:rotate(-20deg);
}

.shape-two:after{
  width:45px;
  height:7px;
  top:12px;
  right:10px;
  transform:rotate(-20deg);
}

.shape-island:before{
  width:52px;
  height:7px;
  bottom:8px;
  right:6px;
}

.shape-island:after{
  width:30px;
  height:7px;
  bottom:25px;
  right:18px;
  background:#a7865a;
}

.material-card{
  overflow:hidden;
  padding:0;
}

.material-img{
  height:105px;
  width:100%;
  background-size:cover;
  background-position:center;
}

.material-content{
  padding:12px;
}

.swatch{
  width:55px;
  height:55px;
  margin:0 auto 8px;
  border-radius:12px;
  box-shadow:inset 0 0 0 1px #0002;
}

.color-white{background:#f2eee5}
.color-cappuccino{background:#c6ae91}
.color-beige{background:#d7c7ad}
.color-grey{background:#898783}
.color-black{background:#171717}
.color-green{background:#65715d}
.color-navy{background:#29333c}
.color-wood{background:linear-gradient(135deg,#7a4d2d,#b47a4d,#6d4027)}

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:10px;
}

.counter button{
  border:0;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#111;
  color:white;
  cursor:pointer;
  font-size:20px;
}

.counter-value{
  font-size:22px;
  font-weight:bold;
  min-width:35px;
  text-align:center;
}

.measure-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.field input:focus{
  border-color:#b29368;
}

.budget-box{
  background:#151515;
  color:white;
  border-radius:18px;
  padding:22px;
}

.budget-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:15px;
}

.budget-value{
  color:#d3b483;
  font-size:28px;
  font-weight:bold;
}

input[type=range]{
  width:100%;
  accent-color:#b29368;
}

.budget-level{
  margin-top:12px;
  display:inline-block;
  padding:5px 12px;
  background:#ffffff12;
  border-radius:20px;
  color:#ddd
