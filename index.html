<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26352d">
<meta name="description" content="صمم ديكورك - صمم مشروعك خطوة بخطوة وتواصل معنا عبر WhatsApp">
<link rel="manifest" href="manifest.json">

<title>صمم ديكورك | Hamza Chraibi</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f4eee5;
  color:#26352d;
  overflow-x:hidden
}
button,input,select{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.container{width:min(1240px,92%);margin:auto}

/* ================= HEADER ================= */

header{
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:1000;
 height:78px;
 display:flex;
 align-items:center;
 background:linear-gradient(#1c2922cc,transparent);
 transition:.35s
}
header.scrolled{
 background:#26352df5;
 box-shadow:0 5px 25px #0003
}
.nav{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{
 color:white;
 font-size:27px;
 font-weight:900
}
.logo span{color:#d8c3a5}
.navlinks{
 display:flex;
 gap:25px;
 align-items:center;
 color:white;
 font-size:14px
}
.navlinks a:hover{color:#d8c3a5}
.navbtn{
 border:0;
 background:#d8c3a5;
 color:#26352d;
 padding:11px 20px;
 border-radius:30px;
 font-weight:bold
}

/* ================= HERO ================= */

.hero{
 height:100vh;
 min-height:650px;
 position:relative;
 overflow:hidden;
 background:#26352d
}
.slide{
 position:absolute;
 inset:0;
 background-size:cover;
 background-position:center;
 opacity:0;
 transform:scale(1.08);
 transition:opacity 1.2s,transform 6s
}
.slide.active{
 opacity:1;
 transform:scale(1)
}
.slide:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(
  90deg,
  #17221ddd,
  #17221d99,
  #17221d20
 )
}
.heroContent{
 position:relative;
 z-index:5;
 height:100%;
 display:flex;
 align-items:center
}
.heroText{
 color:white;
 max-width:700px
}
.eyebrow{
 color:#d8c3a5;
 font-size:14px;
 letter-spacing:2px;
 margin-bottom:20px
}
.hero h1{
 font-size:clamp(48px,8vw,92px);
 line-height:1.02;
 letter-spacing:-3px;
 margin-bottom:25px
}
.hero h1 span{color:#d8c3a5}
.hero p{
 color:#eee;
 line-height:2;
 font-size:18px;
 max-width:650px;
 margin-bottom:30px
}
.buttons{
 display:flex;
 gap:12px;
 flex-wrap:wrap
}
.btn{
 border:0;
 padding:15px 28px;
 border-radius:4px;
 font-weight:bold;
 font-size:15px;
 transition:.3s;
 display:inline-flex;
 justify-content:center;
 align-items:center
}
.btn:hover{transform:translateY(-3px)}
.gold{
 background:#d8c3a5;
 color:#26352d
}
.outline{
 color:white;
 border:1px solid #fff9;
 background:#0002
}
.heroDots{
 position:absolute;
 z-index:8;
 bottom:35px;
 right:4%;
 display:flex;
 gap:8px
}
.dot{
 width:30px;
 height:2px;
 background:#fff6;
 transition:.3s
}
.dot.active{
 width:60px;
 background:#d8c3a5
}

/* ================= INTRO ================= */

.intro{
 padding:100px 0
}
.introGrid{
 display:grid;
 grid-template-columns:1fr 1.4fr;
 gap:70px;
 align-items:center
}
.intro h2{
 font-size:clamp(38px,5vw,60px);
 line-height:1.15
}
.intro h2 span{color:#a68760}
.intro p{
 color:#656861;
 line-height:2;
 font-size:17px
}

/* ================= SECTIONS ================= */

.section{
 padding:90px 0
}
.sectionHead{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:20px;
 margin-bottom:35px
}
.sectionHead h2{font-size:48px}
.sectionHead p{
 color:#777;
 line-height:1.8;
 max-width:450px
}

/* ================= CATEGORIES ================= */

.categories{
 background:#26352d;
 color:white
}
.categories .sectionHead p{color:#c9cec9}
.categoryGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px
}
.category{
 height:360px;
 position:relative;
 overflow:hidden;
 background:#17221d
}
.category img{
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:.75;
 transition:.7s
}
.category:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(to top,#111d 5%,transparent 65%)
}
.category:hover img{
 transform:scale(1.07);
 opacity:1
}
.catInfo{
 position:absolute;
 z-index:3;
 right:25px;
 bottom:25px
}
.catInfo h3{
 font-size:27px;
 margin-bottom:8px
}
.catInfo span{
 color:#d8c3a5;
 font-size:13px
}
.start{
 position:absolute;
 z-index:4;
 left:22px;
 bottom:24px;
 width:42px;
 height:42px;
 border-radius:50%;
 background:#d8c3a5;
 color:#26352d;
 display:grid;
 place-items:center;
 font-weight:bold
}

/* ================= WORK BUTTON ================= */

.worksArea{
 padding:90px 0;
 text-align:center
}
.worksButton{
 border:1px solid #26352d;
 background:#26352d;
 color:white;
 padding:18px 38px;
 border-radius:3px;
 font-size:18px;
 font-weight:bold
}
.worksButton:hover{background:#a68760}

/* ================= SERVICES ================= */

.servicesGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 border-top:1px solid #c9bba8;
 border-right:1px solid #c9bba8
}
.service{
 padding:30px;
 min-height:190px;
 border-left:1px solid #c9bba8;
 border-bottom:1px solid #c9bba8;
 transition:.3s
}
.service:hover{background:#e9dfd1}
.serviceNum{
 color:#a68760;
 margin-bottom:20px
}
.service h3{
 font-size:21px;
 margin-bottom:9px
}
.service p{
 color:#777;
 line-height:1.8
}

/* ================= BUDGET ================= */

.budget{
 background:#26352d;
 color:white
}
.budgetBox{
 max-width:700px;
 margin:auto;
 background:#304238;
 padding:30px
}
.field{margin-bottom:20px}
.field label{
 display:block;
 margin-bottom:8px
}
.field input,.field select{
 width:100%;
 padding:14px;
 background:#26352d;
 border:1px solid #65766c;
 color:white;
 border-radius:3px;
 font-size:16px
}
.total{
 text-align:center;
 border:1px solid #718178;
 padding:20px;
 margin-top:20px
}
.total small{color:#ccc}
.total strong{
 display:block;
 color:#d8c3a5;
 font-size:40px;
 margin-top:5px
}

/* ================= CONTACT ================= */

.contact{
 min-height:500px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:white;
 background:
 linear-gradient(#17221dcc,#17221dee),
 url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1800&q=90")
 center/cover
}
.contact h2{
 font-size:clamp(40px,6vw,70px);
 margin-bottom:18px
}
.contact p{
 color:#ddd;
 line-height:2;
 max-width:650px;
 margin:0 auto 25px
}

/* ================= FOOTER ================= */

footer{
 background:#19251f;
 color:#aaa;
 text-align:center;
 padding:35px 15px
}
footer strong{color:#d8c3a5}

/* ================= WHATSAPP ================= */

.floatWA{
 position:fixed;
 z-index:9999;
 bottom:18px;
 left:18px;
 background:#25d366;
 color:#06200d;
 padding:14px 20px;
 border-radius:30px;
 font-weight:bold;
 box-shadow:0 5px 25px #0004
}

/* ================= MODAL ================= */

.modal{
 position:fixed;
 inset:0;
 z-index:5000;
 background:#101512f5;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px
}
.modal.show{display:flex}
.modalBox{
 width:min(1050px,100%);
 max-height:92vh;
 overflow:auto;
 background:#f4eee5;
 border-radius:10px;
 padding:25px;
 position:relative
}
.close{
 position:absolute;
 left:18px;
 top:15px;
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#26352d;
 color:white;
 font-size:20px
}
.modalTitle{
 text-align:center;
 margin:10px 0 25px
}
.modalTitle h2{font-size:32px}
.gallery{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}
.gallery img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 cursor:pointer;
 transition:.3s
}
.gallery img:hover{transform:scale(1.03)}

/* ================= WIZARD ================= */

.wizard{
 position:fixed;
 inset:0;
 z-index:4000;
 background:#101512f7;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px
}
.wizard.show{display:flex}
.wizardBox{
 width:min(850px,100%);
 max-height:94vh;
 overflow:auto;
 background:#f4eee5;
 border-radius:10px;
 padding:28px
}
.wizardTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #d2c6b6;
 padding-bottom:18px;
 margin-bottom:20px
}
.wizardTop h2{font-size:28px}
.closeWizard{
 border:0;
 background:#26352d;
 color:white;
 width:40px;
 height:40px;
 border-radius:50%;
 font-size:20px
}
.progress{
 display:flex;
 gap:5px;
 margin-bottom:25px
}
.progress i{
 height:4px;
 flex:1;
 background:#d0c4b4
}
.progress i.on{background:#26352d}
.stepTitle{
 text-align:center;
 margin-bottom:25px
}
.stepTitle h3{font-size:28px}
.stepTitle p{
 color:#777;
 margin-top:7px
}
.options{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.option{
 border:1px solid #c8bbaa;
 background:#fffaf4;
 padding:20px;
 min-height:85px;
 border-radius:5px;
 text-align:center;
 transition:.25s
}
.option:hover{
 border-color:#a68760;
 transform:translateY(-2px)
}
.option.selected{
 background:#26352d;
 color:white;
 border-color:#d8c3a5
}
.option strong{
 display:block;
 font-size:18px;
 margin-bottom:5px
}
.option small{color:#777}
.option.selected small{color:#ddd}
.inputs{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px
}
.inputs label{
 display:block;
 font-weight:bold;
 margin-bottom:7px
}
.inputs input,.inputs select,.inputs textarea{
 width:100%;
 padding:14px;
 border:1px solid #c8bbaa;
 background:white;
 border-radius:4px;
 font-size:16px;
 color:#26352d
}
.inputs textarea{
 min-height:100px;
 resize:vertical
}
.full{grid-column:1/-1}
.wizardButtons{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin-top:25px
}
.wizardBtn{
 border:0;
 padding:14px 28px;
 border-radius:4px;
 font-weight:bold;
 background:#26352d;
 color:white
}
.wizardBtn.back{
 background:#d8c3a5;
 color:#26352d
}
.wizardBtn:disabled{
 opacity:.4;
 cursor:not-allowed
}
.summary{
 background:white;
 border:1px solid #d0c4b4;
 padding:20px;
 line-height:2;
 margin-top:15px
}
.summary strong{color:#26352d}
.whatsappFinal{
 display:block;
 text-align:center;
 background:#25d366;
 color:#06200d;
 padding:16px;
 margin-top:18px;
 font-weight:bold;
 border-radius:4px
}

/* ================= MOBILE ================= */

@media(max-width:850px){
 .navlinks{display:none}
 .introGrid{grid-template-columns:1fr;gap:30px}
 .categoryGrid{grid-template-columns:1fr 1fr}
 .servicesGrid{grid-template-columns:1fr 1fr}
 .gallery{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:560px){
 .container{width:90%}
 .hero h1{font-size:48px}
 .hero p{font-size:15px}
 .buttons{width:100%}
 .btn{width:100%}
 .section{padding:70px 0}
 .
