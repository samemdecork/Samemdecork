<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f1ea;
  color:#17231d;
  line-height:1.7;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#17231d;
  color:white;
  box-shadow:0 4px 20px #0003;
}

.header-inner{
  width:min(1180px,92%);
  margin:auto;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#c9aa7b;
}

.home-btn{
  text-decoration:none;
  color:#17231d;
  background:#c9aa7b;
  padding:9px 16px;
  border-radius:22px;
  font-weight:bold;
  font-size:13px;
}

/* HERO */

.hero{
  min-height:300px;
  display:flex;
  align-items:center;
  text-align:center;
  color:white;

  background:
  linear-gradient(#0b1710d9,#0b1710d9),
  url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85")
  center/cover;
}

.hero-content{
  width:min(900px,92%);
  margin:auto;
  padding:55px 0;
}

.hero small{
  color:#c9aa7b;
  font-weight:bold;
  letter-spacing:2px;
}

.hero h1{
  font-size:clamp(34px,6vw,58px);
  margin:8px 0;
}

.hero p{
  color:#ddd;
  max-width:700px;
  margin:auto;
}

/* MAIN */

.container{
  width:min(1100px,92%);
  margin:35px auto 70px;
}

/* CLIENT */

.client-box{
  background:white;
  padding:24px;
  border-radius:20px;
  margin-bottom:22px;
  box-shadow:0 6px 25px #0000000b;
}

.client-box h2{
  font-size:21px;
  margin-bottom:5px;
}

.client-box p{
  color:#777;
  font-size:13px;
  margin-bottom:18px;
}

.client-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  outline:none;
  background:#fafafa;
}

.field input:focus,
.field textarea:focus{
  border-color:#b29368;
}

/* PROGRESS */

.progress-box{
  background:white;
  padding:16px;
  border-radius:18px;
  margin-bottom:22px;
}

.progress{
  height:7px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#b29368;
  transition:.3s;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:#777;
  font-size:12px;
}

/* SECTION */

.config-section{
  background:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 6px 25px #0000000b;
  scroll-margin-top:90px;
}

.section-title{
  margin-bottom:18px;
}

.section-title small{
  color:#a1835b;
  font-weight:bold;
}

.section-title h2{
  font-size:24px;
  margin:3px 0;
}

.section-title p{
  color:#777;
  font-size:13px;
}

/* OPTIONS */

.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
}

.option{
  position:relative;
  min-height:95px;
  padding:15px;
  border:2px solid #eee;
  background:#fafafa;
  border-radius:16px;
  text-align:center;
  transition:.2s;
}

.option:hover{
  transform:translateY(-2px);
  border-color:#c9aa7b;
}

.option.selected{
  border-color:#a7865a;
  background:#fbf7ef;
  box-shadow:0 0 0 3px #c9aa7b22;
}

.option.selected:after{
  content:"✓";
  position:absolute;
  top:7px;
  right:7px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#a7865a;
  color:white;
  font-size:12px;
  line-height:22px;
}

.option-icon{
  font-size:30px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:5px;
}

.option-title{
  font-weight:900;
  font-size:14px;
}

.option-desc{
  color:#777;
  font-size:11px;
}

/* SHAPES */

.shape{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.shape-box{
  position:relative;
  width:75px;
  height:65px;
}

.shape-box i{
  position:absolute;
  display:block;
  background:#26342c;
  border-radius:4px;
}

.shape-l i:nth-child(1){
  width:58px;
  height:8px;
  right:4px;
  bottom:8px;
}

.shape-l i:nth-child(2){
  width:8px;
  height:50px;
  right:4px;
  bottom:8px;
}

.shape-u i:nth-child(1){
  width:58px;
  height:8px;
  right:8px;
  bottom:8px;
}

.shape-u i:nth-child(2){
  width:8px;
  height:50px;
  right:8px;
  bottom:8px;
}

.shape-u i:nth-child(3){
  width:8px;
  height:50px;
  left:8px;
  bottom:8px;
}

.shape-line i:nth-child(1){
  width:65px;
  height:8px;
  right:5px;
  bottom:8px;
}

.shape-two i:nth-child(1){
  width:52px;
  height:8px;
  right:5px;
  bottom:13px;
  transform:rotate(-20deg);
}

.shape-two i:nth-child(2){
  width:52px;
  height:8px;
  right:10px;
  top:15px;
  transform:rotate(-20deg);
}

.shape-island i:nth-child(1){
  width:60px;
  height:8px;
  right:7px;
  bottom:8px;
}

.shape-island i:nth-child(2){
  width:38px;
  height:8px;
  right:18px;
  bottom:28px;
  background:#b29368;
}

/* COUNTER */

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}

.counter button{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#17231d;
  color:white;
  font-size:22px;
}

.counter-value{
  min-width:45px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

/* MEASURE */

.measure-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}

/* BUDGET */

.budget{
  background:#17231d;
  color:white;
  border-radius:18px;
  padding:22px;
}

.budget-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.budget-value{
  color:#d5b786;
  font-size:27px;
  font-weight:bold;
}

.budget input[type=range]{
  width:100%;
  margin-top:20px;
  accent-color:#c9aa7b;
}

.budget-level{
  display:inline-block;
  margin-top:12px;
  padding:5px 13px;
  border-radius:20px;
  background:#ffffff12;
  color:#ddd;
  font-size:13px;
}

/* UPLOAD */

.upload{
  border:2px dashed #cdbb9d;
  background:#fcfaf6;
  border-radius:16px;
  padding:25px;
  text-align:center;
}

.upload input{
  margin-top:12px;
}

.preview{
  display:none;
  margin-top:15px;
}

.preview img{
  max-height:250px;
  width:auto;
  max-width:100%;
  margin:auto;
  border-radius:14px;
}

/* SUMMARY */

.summary{
  background:#17231d;
  color:white;
  padding:25px;
  border-radius:20px;
  margin-top:25px;
}

.summary h2{
  margin-bottom:15px;
}

.summary-list{
  display:grid;
  gap:8px;
}

.summary-row{
  padding:9px 0;
  border-bottom:1px solid #ffffff15;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.summary-row span:first-child{
  color:#aaa;
}

.summary-row span:last-child{
  font-weight:bold;
  color:#d8bd91;
}

/* SEND */

.send-box{
  text-align:center;
  margin-top:20px;
}

.send-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  max-width:600px;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#25d366;
  color:#06200d;
  font-size:17px;
  font-weight:900;
}

.note{
  color:#777;
  font-size:12px;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:600px){

  .header-inner{
    min-height:62px;
  }

  .logo{
    font-size:19px;
  }

  .home-btn{
    font-size:11px;
    padding:8px 12px;
  }

  .hero{
    min-height:270px;
  }

  .hero-content{
    padding:40px 0;
  }

  .client-grid{
    grid-template-columns:1fr;
  }

  .config-section{
    padding:20px 15px;
  }

  .options{
    grid-template-columns:repeat(2,1fr);
  }

  .option{
    min-height:88px;
  }

  .budget-top{
    flex-direction:column;
    align-items:flex-start;
  }

  .summary-row{
    flex-direction:column;
    gap:2px;
  }
}
</style>
</head>

/* =====================================================
   بناء الاختيارات
===================================================== */

function renderSections(){

  const container = document.getElementById("sections");

  container.innerHTML = "";

  config.sections.forEach((section,index)=>{

    const wrapper = document.createElement("section");

    wrapper.className = "config-section";

    wrapper.id = "section-" + section.id;

    let html = `

      <div class="section-title">

        <small>${String(index+1).padStart(2,"0")}</small>

        <h2>${section.title}</h2>

        <p>${section.question}</p>

      </div>

    `;


    /* OPTIONS */

    if(section.options){

      html += `<div class="options">`;

      section.options.forEach((option,i)=>{

        const value = option[0];
        const title = option[1];
        const desc = option[2] || "";

        let icon = "◆";

        if(section.type === "shape"){

          icon = `
            <div class="shape">
              <div class="shape-box shape-${value}">
                <i></i>
                <i></i>
                <i></i>
              </div>
            </div>
          `;

        }else{

          const icons = [
            "▣","◇","●","◆","▤","◈","○","□"
          ];

          icon = `<div class="option-icon">${icons[i % icons.length]}</div>`;

        }

        html += `

          <button
            type="button"
            class="option"
            data-section="${section.id}"
            data-value="${escapeHtml(value)}"
            data-title="${escapeHtml(title)}"
            data-multi="${section.multi ? "1":"0"}">

            ${icon}

            <div class="option-title">
              ${title}
            </div>

            ${
              desc
              ? `<div class="option-desc">${desc}</div>`
              : ""
            }

          </button>

        `;

      });

      html += `</div>`;

    }


    /* COUNTER */

    if(section.type === "counter"){

      html += `

        <div class="counter">

          <button
            type="button"
            data-counter-minus="${section.id}">
            −
          </button>

          <div
            class="counter-value"
            id="counter-${section.id}">
            0
          </div>

          <button
            type="button"
            data-counter-plus="${section.id}">
            +
          </button>

        </div>

        <div style="text-align:center;color:#777;font-size:12px;margin-top:8px">
          ${section.min} إلى ${section.max} ${section.unit}
        </div>

      `;

      answers[section.id] = section.min;

    }


    /* MEASURE */

    if(section.type === "measure"){

      html += `<div class="measure-grid">`;

      section.fields.forEach(field=>{

        html += `

          <div class="field">

            <label>${field[0]} (cm)</label>

            <input
              type="number"
              min="0"
              placeholder="مثلاً 300"
              data-measure="${field[1]}">

          </div>

        `;

      });

      html += `</div>`;

    }


    wrapper.innerHTML = html;

    container.appendChild(wrapper);

  });

}

renderSections();


/* =====================================================
   اختيار العناصر
===================================================== */

document.addEventListener("click",function(e){

  const button = e.target.closest(".option");

  if(!button) return;

  const sectionId = button.dataset.section;

  const isMulti = button.dataset.multi === "1";

  const value = button.dataset.value;

  const title = button.dataset.title;


  if(isMulti){

    if(!answers[sectionId]){
      answers[sectionId] = [];
    }

    const index = answers[sectionId].findIndex(
      x => x.value === value
    );

    if(index >= 0){

      answers[sectionId].splice(index,1);

      button.classList.remove("selected");

    }else{

      answers[sectionId].push({
        value:value,
        title:title
      });

      button.classList.add("selected");

    }

  }else{

    answers[sectionId] = {
      value:value,
      title:title
    };

    document
      .querySelectorAll(
        `.option[data-section="${sectionId}"]`
      )
      .forEach(el=>{
        el.classList.remove("selected");
      });

    button.classList.add("selected");

    /* انتقال تلقائي للاختيار الموالي */

    setTimeout(()=>{

      const current =
        document.getElementById("section-"+sectionId);

      if(!current) return;

      let next = current.nextElementSibling;

      while(next && !next.classList.contains("config-section")){
        next = next.nextElementSibling;
      }

      if(next){

        next.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      }

    },220);

  }

  updateSummary();
  updateProgress();

});


/* =====================================================
   COUNTERS
===================================================== */

document.addEventListener("click",function(e){

  const plus = e.target.closest("[data-counter-plus]");
  const minus = e.target.closest("[data-counter-minus]");

  if(!plus && !minus) return;

  const id =
    plus
    ? plus.dataset.counterPlus
    : minus.dataset.counterMinus;

  const section =
    config.sections.find(x=>x.id===id);

  let value =
    typeof answers[id] === "number"
    ? answers[id]
    : section.min;

  if(plus){
    value++;
  }else{
    value--;
  }

  value =
    Math.max(
      section.min,
      Math.min(section.max,value)
    );

  answers[id] = value;

  document.getElementById(
    "counter-"+id
  ).textContent = value;

  updateSummary();
  updateProgress();

});

document.addEventListener("input",function(e){

  if(!e.target.matches("[data-measure]")) return;

  const key = e.target.dataset.measure;

  if(!answers.measure){
    answers.measure = {};
  }

  answers.measure[key] = e.target.value;

  updateSummary();
  updateProgress();

});

function updateBudget(){

  const value =
    Number(budget.value);

  document.getElementById(
    "budgetValue"
  ).textContent =
    value.toLocaleString("fr-FR")+" DH";

  let level = "اقتصادي";

  if(value >= 10000 && value < 25000){
    level = "متوسط";
  }

  if(value >= 25000){
    level = "فاخر";
  }

  document.getElementById(
    "budgetLevel"
  ).textContent = level;

  answers.budget = value;
  answers.budgetLevel = level;

  updateSummary();
  updateProgress();

}

/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const list =
    document.getElementById("summaryList");

  let rows = "";

  const name =
    document.getElementById("clientName")?.value || "—";

  const city =
    document.getElementById("clientCity")?.value || "—";


  rows += row("الاسم",name);
  rows += row("المدينة",city);


  config.sections.forEach(section=>{

    const answer = answers[section.id];

    if(answer === undefined) return;


    if(Array.isArray(answer)){

      if(!answer.length) return;

      rows += row(
        section.title,
        answer.map(x=>x.title).join("، ")
      );

    }

    else if(
      typeof answer === "object" &&
      answer !== null &&
      section.type !== "measure"
    ){

      rows += row(
        section.title,
        answer.title
      );

    }

    else if(
      typeof answer === "number"
    ){

      rows += row(
        section.title,
        answer+" "+(section.unit || "")
      );

    }

    else if(section.type === "measure"){

      const values = [];

      section.fields.forEach(field=>{

        const value =
          answer[field[1]];

        if(value){
          values.push(
            field[0]+": "+value+" cm"
          );
        }

      });

      if(values.length){

        rows += row(
          section.title,
          values.join(" • ")
        );

      }

    }

  });


  rows += row(
    "الميزانية",
    (answers.budget || 15000)
      .toLocaleString("fr-FR")+" DH"
    +" • "
    +(answers.budgetLevel || "متوسط")
  );


  list.innerHTML = rows;

}


function row(title,value){

  return `

    <div class="summary-row">

      <span>${escapeHtml(title)}</span>

      <span>${escapeHtml(String(value))}</span>

    </div>

  `;

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  let total = config.sections.length + 2;
  let done = 0;


  config.sections.forEach(section=>{

    const answer = answers[section.id];

    if(section.type === "measure"){

      if(
        answer &&
        Object.values(answer).some(v=>v)
      ){
        done++;
      }

    }else if(Array.isArray(answer)){

      if(answer.length) done++;

    }else if(
      answer !== undefined &&
      answer !== null
    ){

      done++;

    }

  });


  const name =
    document.getElementById("clientName")?.value;

  const city =
    document.getElementById("clientCity")?.value;

  if(name && city) done++;

  if(answers.budget) done++;


  const percent =
    Math.min(
      100,
      Math.round(done / total * 100)
    );


  document.getElementById(
    "progressBar"
  ).style.width = percent+"%";

  document.getElementById(
    "progressText"
  ).textContent = percent+"%";

}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")

}
