<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>أعمالنا | صمم ديكورك</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f0e8;
  color:#17231d;
}

/* HEADER */

header{
  height:82px;
  background:#101f18;
  color:#fff;
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 5px 20px #0003;
}

.header-inner{
  width:min(1200px,92%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#fff;
  text-decoration:none;
}

.logo span{
  color:#c9aa7b;
}

/* HOME BUTTON */

.home-btn{
  text-decoration:none;
  color:#fff;
  border:1px solid #c9aa7b;
  padding:12px 22px;
  border-radius:30px;
  font-size:16px;
  transition:.25s;
}

.home-btn:hover{
  background:#c9aa7b;
  color:#17231d;
}

/* HERO */

.hero{
  text-align:center;
  padding:75px 20px 45px;
}

.eyebrow{
  color:#9a7d58;
  letter-spacing:3px;
  font-size:14px;
  margin-bottom:15px;
}

h1{
  font-size:clamp(42px,7vw,70px);
  margin-bottom:18px;
}

.hero p{
  color:#777;
  font-size:17px;
  line-height:1.9;
}

/* FILTERS */

.filters{
  width:min(1200px,92%);
  margin:0 auto 45px;

  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.filter{
  border:1px solid #c9aa7b;
  background:transparent;
  color:#17231d;
  padding:12px 20px;
  border-radius:30px;
  cursor:pointer;
  font-family:inherit;
  font-size:15px;
  transition:.25s;
}

.filter:hover,
.filter.active{
  background:#17231d;
  color:#fff;
}

/* GALLERY */

.gallery{
  width:min(1200px,92%);
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 5px 20px #00000012;
  animation:show .4s ease;
}

.card img{
  display:block;
  width:100%;
  height:300px;
  object-fit:cover;
  transition:.4s;
}

.card:hover img{
  transform:scale(1.04);
}

.card-info{
  padding:15px;
  background:#fff;
}

.card-category{
  color:#9a7d58;
  font-size:13px;
}

/* EMPTY / ERROR */

.message{
  width:min(700px,90%);
  margin:40px auto;
  text-align:center;
  padding:35px 20px;
  color:#777;
  font-size:18px;
  line-height:2;
}

.loading{
  color:#9a7d58;
}

.error{
  color:#9b3939;
}

.hidden{
  display:none!important;
}

/* FOOTER */

footer{
  margin-top:80px;
  background:#101a15;
  color:#aaa;
  text-align:center;
  padding:30px 15px;
  line-height:2;
}

footer strong{
  color:#c9aa7b;
}

/* ANIMATION */

@keyframes show{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MOBILE */

@media(max-width:800px){

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card img{
    height:230px;
  }

  .logo{
    font-size:23px;
  }

  .home-btn{
    padding:10px 17px;
    font-size:14px;
  }
}

@media(max-width:550px){

  header{
    height:72px;
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .card img{
    height:280px;
  }

  .hero{
    padding-top:55px;
  }

  .filters{
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding-bottom:8px;
  }

  .filter{
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-inner">

    <a href="index.html" class="logo">
      صمم <span>ديكورك</span>
    </a>

    <a href="index.html" class="home-btn">
      ← الرئيسية
    </a>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <div class="eyebrow">
    REAL PROJECTS
  </div>

  <h1>
    أعمالنا
  </h1>

  <p>
    صور حقيقية من أعمال ومشاريع صمم ديكورك
  </p>

</section>


<!-- FILTERS -->

<div class="filters">

  <button class="filter active" data-category="all">
    الكل
  </button>

  <button class="filter" data-category="kitchen">
    🍳 المطابخ
  </button>

  <button class="filter" data-category="salon">
    🛋️ الصالونات
  </button>

  <button class="filter" data-category="bedroom">
    🛏️ غرف النوم
  </button>

  <button class="filter" data-category="tapisserie">
    🧵 الطابيسري والستور
  </button>

  <button class="filter" data-category="dressing">
    🚪 Dressing
  </button>

  <button class="filter" data-category="mobil-tv">
    📺 Meuble TV
  </button>

  <button class="filter" data-category="accessories">
    ✨ الإكسسوارات
  </button>

</div>


<!-- GALLERY -->

<div id="gallery" class="gallery"></div>


<div id="loading" class="message loading">
  ⏳ جاري تحميل الصور...
</div>


<div id="error" class="message error hidden">
  وقع مشكل في تحميل الصور.<br>
  حاول تعاود تحديث الصفحة.
</div>


<div id="empty" class="message hidden">
  ما كايناش صور فهاد القسم دابا.
</div>


<!-- FOOTER -->

<footer>

  <strong>صمم ديكورك</strong> © 2026

  <br>

  جميع الحقوق محفوظة —
  <strong>Hamza Chtaibi</strong>

</footer>


<script>

let allImages = [];
let currentCategory = "all";

const gallery =
  document.getElementById("gallery");

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const emptyBox =
  document.getElementById("empty");


/* تحويل أسماء الأقسام */

function normalizeCategory(category){

  if(!category){
    return "general";
  }

  category =
    category.toLowerCase().trim();

  const map = {

    "kitchen":"kitchen",
    "kitchens":"kitchen",
    "مطبخ":"kitchen",
    "المطبخ":"kitchen",
    "المطابخ":"kitchen",

    "salon":"salon",
    "صالون":"salon",
    "الصالون":"salon",
    "الصالونات":"salon",

    "bedroom":"bedroom",
    "غرفة النوم":"bedroom",
    "غرف النوم":"bedroom",

    "tapisserie":"tapisserie",
    "tapiserie":"tapisserie",
    "طابيسري":"tapisserie",
    "الطابيسري":"tapisserie",
    "الطابيسري والستور":"tapisserie",
    "tapisserie et store":"tapisserie",
    "stores":"tapisserie",
    "store":"tapisserie",

    "dressing":"dressing",
    "placard":"dressing",

    "mobil-tv":"mobil-tv",
    "meuble-tv":"mobil-tv",
    "meuble tv":"mobil-tv",

    "accessories":"accessories",
    "accessoire":"accessories",
    "accessoires":"accessories",
    "الإكسسوارات":"accessories"

  };

  return map[category] || category;
}


/* تحميل الصور */

async function loadImages(){

  loading.classList.remove("hidden");
  errorBox.classList.add("hidden");
  emptyBox.classList.add("hidden");

  try{

    const response =
      await fetch("/api/images",{
        cache:"no-store"
      });

    if(!response.ok){

      throw new Error(
        "API error: " + response.status
      );

    }

    const data =
      await response.json();

    if(!data.images){

      throw new Error(
        "No images returned"
      );

    }

    allImages =
      data.images.map(img => ({

        ...img,

        category:
          normalizeCategory(img.category)

      }));

    loading.classList.add("hidden");

    renderGallery();

  }catch(err){

    console.error(err);

    loading.classList.add("hidden");

    errorBox.classList.remove("hidden");

  }

}


/* عرض الصور */

function renderGallery(){

  gallery.innerHTML = "";

  let images = allImages;

  if(currentCategory !== "all"){

    images =
      allImages.filter(
        img =>
          img.category === currentCategory
      );

  }

  if(images.length === 0){

    emptyBox.classList.remove("hidden");

    return;

  }

  emptyBox.classList.add("hidden");

  images.forEach(img => {

    const card =
      document.createElement("div");

    card.className = "card";

    const image =
      document.createElement("img");

    image.src = img.url;

    image.alt =
      "مشروع صمم ديكورك";

    image.loading = "lazy";

    image.onerror = function(){

      card.remove();

    };

    const info =
      document.createElement("div");

    info.className = "card-info";

    const category =
      document.createElement("div");

    category.className =
      "card-category";

    category.textContent =
      getCategoryName(img.category);

    info.appendChild(category);

    card.appendChild(image);

    card.appendChild(info);

    gallery.appendChild(card);

  });

}


/* اسم القسم بالعربية */

function getCategoryName(category){

  const names = {

    kitchen:"المطابخ",

    salon:"الصالونات",

    bedroom:"غرف النوم",

    tapisseries:"الطابيسري والستور",

    tapisserie:"الطابيسري والستور",

    dressing:"Dressing & Placard",

    "mobil-tv":"Meuble TV",

    accessories:"الإكسسوارات",

    general:"مشاريع صمم ديكورك"

  };

  return names[category] ||
         "مشاريع صمم ديكورك";

}


/* الفلاتر */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".filter")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        this.classList.add("active");

        currentCategory =
          this.dataset.category;

        renderGallery();

        window.scrollTo({
          top:
            document.querySelector(".filters")
              .offsetTop - 90,
          behavior:"smooth"
        });

      }
    );

  });


/* البداية */

loadImages();

</script>

</body>
</html>
