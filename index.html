<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة صمم ديكورك</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f4f2;
  color:#17211c;
  line-height:1.7;
}

.wrap{
  width:min(1150px,92%);
  margin:auto;
}

header{
  background:#101814;
  color:#fff;
  padding:18px 0;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 20px #0003;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#cfd3d4;
}

.back{
  color:#fff;
  border:1px solid #777;
  padding:8px 15px;
  border-radius:6px;
}

main{
  padding:40px 0 80px;
}

h1{
  font-size:36px;
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  margin-bottom:30px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 5px 25px #0000000d;
  border:1px solid #ddd;
}

.card h2{
  margin-bottom:20px;
  font-size:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-family:inherit;
  font-size:15px;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#17211c;
}

.file{
  padding:10px;
  background:#f7f7f5;
}

.btn{
  border:0;
  padding:13px 22px;
  border-radius:7px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.btn-dark{
  background:#17211c;
  color:#fff;
}

.btn-dark:hover{
  background:#26362e;
}

.btn-silver{
  background:#cfd3d4;
  color:#17211c;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  display:none;
}

.status.ok{
  display:block;
  background:#e4f6e9;
  color:#176b31;
}

.status.error{
  display:block;
  background:#ffe6e6;
  color:#9b1c1c;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.preview-item{
  position:relative;
  border-radius:8px;
  overflow:hidden;
  background:#eee;
  aspect-ratio:1;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-item .loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0008;
  color:#fff;
  font-weight:bold;
}

.note{
  background:#f0f2f0;
  border-right:4px solid #17211c;
  padding:12px 15px;
  margin-bottom:20px;
  color:#555;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .preview{
    grid-template-columns:repeat(2,1fr);
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
<div class="wrap header">

<div class="logo">
صمم <span>ديكورك</span>
</div>

<a href="index.html" class="back">
← الموقع
</a>

</div>
</header>


<main>

<div class="wrap">

<h1>لوحة إدارة صمم ديكورك</h1>

<p class="subtitle">
من هنا تقدر تضيف الأعمال والمنتجات مباشرة من الموقع.
</p>


<!-- =========================
     أعمالنا
========================= -->

<div class="card">

<h2>📸 إضافة عمل جديد</h2>

<div class="note">
اختار الصورة، القسم، واسم المشروع. الصورة غادي تترفع مباشرة إلى Cloudinary.
</div>

<div class="grid">

<div class="field">
<label>الصورة</label>

<input
type="file"
id="workImage"
class="file"
accept="image/*"
multiple
>

</div>


<div class="field">

<label>القسم</label>

<select id="workCategory">

<option value="kitchen">المطابخ</option>
<option value="dressing">Dressing</option>
<option value="bedroom">غرف النوم</option>
<option value="salon">الصالونات</option>
<option value="tv">Meuble TV</option>
<option value="other">أعمال أخرى</option>

</select>

</div>


<div class="field">

<label>اسم المشروع</label>

<input
type="text"
id="workTitle"
placeholder="مثال: مطبخ مودرن"
/>

</div>


<div class="field">

<label>الوصف</label>

<input
type="text"
id="workDescription"
placeholder="مثال: مطبخ MDF مع Quartz"
/>

</div>

</div>

<button
class="btn btn-dark"
onclick="uploadWorks()"
>
⬆️ رفع العمل
</button>

<div id="workStatus" class="status"></div>

<div id="workPreview" class="preview"></div>

</div>



<!-- =========================
     التابيسري
========================= -->

<div class="card">

<h2>🪟 إضافة منتج تابيسري</h2>

<div class="grid">

<div class="field">

<label>صورة المنتج</label>

<input
type="file"
id="tapisImage"
class="file"
accept="image/*"
multiple
>

</div>


<div class="field">

<label>نوع المنتج</label>

<select id="tapisType">

<option>ستور</option>
<option>Rideau</option>
<option>سدادر</option>
<option>كوسان</option>
<option>تابيسري</option>
<option>ناموسية</option>
<option>أخرى</option>

</select>

</div>


<div class="field">

<label>اسم المنتج</label>

<input
type="text"
id="tapisName"
placeholder="مثال: ستور مودرن"
/>

</div>


<div class="field">

<label>الثمن بالدرهم</label>

<input
type="number"
id="tapisPrice"
placeholder="850"
/>

</div>


<div class="field full">

<label>الوصف</label>

<textarea
id="tapisDescription"
placeholder="وصف المنتج..."
></textarea>

</div>

</div>

<button
class="btn btn-dark"
onclick="uploadTapis()"
>
⬆️ إضافة المنتج
</button>

<div id="tapisStatus" class="status"></div>

<div id="tapisPreview" class="preview"></div>

</div>



<!-- =========================
     المبيعات
========================= -->

<div class="card">

<h2>🛒 إضافة منتج للبيع</h2>

<div class="grid">

<div class="field">

<label>صور المنتج</label>

<input
type="file"
id="productImage"
class="file"
accept="image/*"
multiple
>

</div>


<div class="field">

<label>التصنيف</label>

<select id="productCategory">

<option>إكسسوارات</option>
<option>Electroménager</option>
<option>مستلزمات المطبخ</option>
<option>مستلزمات المنزل</option>
<option>أخرى</option>

</select>

</div>


<div class="field">

<label>اسم المنتج</label>

<input
type="text"
id="productName"
placeholder="مثال: Poignée moderne"
/>

</div>


<div class="field">

<label>الثمن</label>

<input
type="number"
id="productPrice"
placeholder="150"
/>

</div>


<div class="field">

<label>الثمن القديم - اختياري</label>

<input
type="number"
id="productOldPrice"
placeholder="200"
/>

</div>


<div class="field">

<label>الحالة</label>

<select id="productStock">

<option value="available">متوفر</option>
<option value="unavailable">غير متوفر</option>

</select>

</div>


<div class="field full">

<label>الوصف</label>

<textarea
id="productDescription"
placeholder="وصف المنتج..."
></textarea>

</div>

</div>

<button
class="btn btn-dark"
onclick="uploadProduct()"
>
⬆️ إضافة المنتج
</button>

<div id="productStatus" class="status"></div>

<div id="productPreview" class="preview"></div>

</div>



<!-- =========================
     الشركاء
========================= -->

<div class="card">

<h2>🏢 إضافة شريك</h2>

<div class="grid">

<div class="field">

<label>اسم الشركة</label>

<input
type="text"
id="partnerName"
placeholder="مثال: شركة ABC"
/>

</div>


<div class="field">

<label>رابط الشركة - اختياري</label>

<input
type="url"
id="partnerUrl"
placeholder="https://..."
/>

</div>


<div class="field full">

<label>Logo الشركة</label>

<input
type="file"
id="partnerLogo"
class="file"
accept="image/*"
>

</div>

</div>

<button
class="btn btn-dark"
onclick="uploadPartner()"
>
⬆️ إضافة الشريك
</button>

<div id="partnerStatus" class="status"></div>

<div id="partnerPreview" class="preview"></div>

</div>

</div>

</main>


<script>

/* =====================================
   CLOUDINARY
===================================== */

const CLOUD_NAME = "c-9026c93655b3994f1c3149a1c721ee";

const UPLOAD_PRESET = "samemdecork_images";


/*
   ملاحظة:
   بدّل CLOUD_NAME بالقيمة الحقيقية
   ديال Cloudinary ديالك إذا كانت مختلفة.
*/


/* =====================================
   رفع صورة واحدة
===================================== */

async function uploadImage(file, folder, context={}){

  const url =
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

  const form = new FormData();

  form.append("file",file);

  form.append("upload_preset",UPLOAD_PRESET);

  form.append("folder",folder);

  if(context.category)
    form.append(
      "context",
      `category=${context.category}|title=${context.title||""}|description=${context.description||""}|price=${context.price||""}|old_price=${context.old_price||""}|stock=${context.stock||""}|type=${context.type||""}`
    );

  const response = await fetch(url,{
    method:"POST",
    body:form
  });

  const data = await response.json();

  if(!response.ok || !data.secure_url){

    throw new Error(
      data.error?.message ||
      "فشل رفع الصورة"
    );

  }

  return data;
}


/* =====================================
   عرض الحالة
===================================== */

function status(id,message,type="ok"){

  const el=document.getElementById(id);

  el.textContent=message;

  el.className="status "+type;
}


/* =====================================
   عرض الصور
===================================== */

function showPreview(containerId,url){

  const box=document.getElementById(containerId);

  const div=document.createElement("div");

  div.className="preview-item";

  div.innerHTML=`
    <img src="${url}" alt="">
  `;

  box.prepend(div);
}


/* =====================================
   أعمالنا
===================================== */

async function uploadWorks(){

  const files=
    document.getElementById("workImage").files;

  const category=
    document.getElementById("workCategory").value;

  const title=
    document.getElementById("workTitle").value.trim();

  const description=
    document.getElementById("workDescription").value.trim();


  if(!files.length){

    status(
      "workStatus",
      "اختار صورة أولاً",
      "error"
    );

    return;
  }


  status(
    "workStatus",
    "جاري رفع الصور..."
  );


  try{

    for(const file of files){

      const data=
      await uploadImage(
        file,
        "samemdecork/works/"+category,
        {
          category,
          title,
          description
        }
      );

      showPreview(
        "workPreview",
        data.secure_url
      );
    }


    status(
      "workStatus",
      "✅ تم رفع الصور بنجاح"
    );

  }catch(error){

    status(
      "workStatus",
      "❌ "+error.message,
      "error"
    );

  }

}


/* =====================================
   تابيسري
===================================== */

async function uploadTapis(){

  const files=
    document.getElementById("tapisImage").files;

  const type=
    document.getElementById("tapisType").value;

  const name=
    document.getElementById("tapisName").value.trim();

  const price=
    document.getElementById("tapisPrice").value;

  const description=
    document.getElementById("tapisDescription").value.trim();


  if(!files.length || !name || !price){

    status(
      "tapisStatus",
      "دخل الصورة والاسم والثمن",
      "error"
    );

    return;
  }


  status(
    "tapisStatus",
    "جاري رفع المنتج..."
  );


  try{

    for(const file of files){

      const data=
      await uploadImage(
        file,
        "samemdecork/tapisserie",
        {
          category:"tapisserie",
          type,
          title:name,
          price,
          description
        }
      );

      showPreview(
        "tapisPreview",
        data.secure_url
      );
    }


    status(
      "tapisStatus",
      "✅ تمت إضافة المنتج"
    );

  }catch(error){

    status(
      "tapisStatus",
      "❌ "+error.message,
      "error"
    );

  }

}


/* =====================================
   المنتجات
===================================== */

async function uploadProduct(){

  const files=
    document.getElementById("productImage").files;

  const category=
    document.getElementById("productCategory").value;

  const name=
    document.getElementById("productName").value.trim();

  const price=
    document.getElementById("productPrice").value;

  const oldPrice=
    document.getElementById("productOldPrice").value;

  const stock=
    document.getElementById("productStock").value;

  const description=
    document.getElementById("productDescription").value.trim();


  if(!files.length || !name || !price){

    status(
      "productStatus",
      "دخل الصورة والاسم والثمن",
      "error"
    );

    return;
  }


  status(
    "productStatus",
    "جاري رفع المنتج..."
  );


  try{

    for(const file of files){

      const data=
      await uploadImage(
        file,
        "samemdecork/products/"+category,
        {
          category,
          title:name,
          price,
          old_price:oldPrice,
          stock,
          description
        }
      );

      showPreview(
        "productPreview",
        data.secure_url
      );
    }


    status(
      "productStatus",
      "✅ تمت إضافة المنتج"
    );

  }catch(error){

    status(
      "productStatus",
      "❌ "+error.message,
      "error"
    );

  }

}


/* =====================================
   الشركاء
===================================== */

async function uploadPartner(){

  const file=
    document.getElementById("partnerLogo").files[0];

  const name=
    document.getElementById("partnerName").value.trim();

  const url=
    document.getElementById("partnerUrl").value.trim();


  if(!file || !name){

    status(
      "partnerStatus",
      "دخل اسم الشركة والـ Logo",
      "error"
    );

    return;
  }


  status(
    "partnerStatus",
    "جاري رفع Logo..."
  );


  try{

    const data=
    await uploadImage(
      file,
      "samemdecork/partners",
      {
        category:"partner",
        title:name,
        description:url
      }
    );


    showPreview(
      "partnerPreview",
      data.secure_url
    );


    status(
      "partnerStatus",
      "✅ تمت إضافة الشريك"
    );


  }catch(error){

    status(
      "partnerStatus",
      "❌ "+error.message,
      "error"
    );

  }

}

</script>

</body>
</html>
