<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>إدارة | صمم ديكورك</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#0b110e;
color:#fff;
min-height:100vh;
}

.wrap{
width:min(1150px,92%);
margin:auto;
}

header{
background:#111a15;
border-bottom:1px solid #303936;
padding:18px 0;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
}

.logo span{
color:#cfd2d4;
}

.back{
color:#cfd2d4;
text-decoration:none;
}

main{
padding:35px 0 70px;
}

h1{
font-size:34px;
margin-bottom:7px;
}

.subtitle{
color:#929b96;
margin-bottom:30px;
}

.panel{
background:#121b16;
border:1px solid #29332e;
border-radius:12px;
padding:25px;
margin-bottom:22px;
}

.field{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
select{
width:100%;
padding:13px;
background:#0b110e;
color:#fff;
border:1px solid #3b4641;
border-radius:7px;
font-family:inherit;
}

.btn{
border:0;
padding:13px 22px;
border-radius:7px;
font-family:inherit;
font-weight:bold;
cursor:pointer;
}

.btn-main{
background:#cfd2d4;
color:#17211c;
}

.btn-danger{
background:#8c2929;
color:#fff;
}

.btn:disabled{
opacity:.5;
}

.drop{
border:2px dashed #46524c;
padding:35px 20px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.drop:hover{
border-color:#cfd2d4;
}

.drop strong{
display:block;
font-size:18px;
margin-bottom:7px;
}

.drop span{
color:#8e9792;
font-size:13px;
}

#fileInput{
display:none;
}

.preview{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:12px;
margin:20px 0;
}

.preview img{
width:100%;
height:150px;
object-fit:cover;
border-radius:7px;
}

.progress{
color:#cfd2d4;
margin:12px 0;
}

.message{
padding:12px;
border-radius:7px;
margin-top:15px;
display:none;
}

.success{
display:block;
background:#12351f;
color:#a9e6bb;
}

.error{
display:block;
background:#401717;
color:#ffb4b4;
}

.works{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:15px;
}

.work{
background:#0b110e;
border:1px solid #29332e;
border-radius:9px;
overflow:hidden;
}

.work img{
width:100%;
height:180px;
object-fit:cover;
}

.info{
padding:12px;
}

.info strong{
display:block;
margin-bottom:5px;
}

.info small{
color:#8f9893;
}

.delete{
width:100%;
margin-top:10px;
}

@media(max-width:850px){

.preview,
.works{
grid-template-columns:
repeat(2,1fr);
}

}

@media(max-width:500px){

.preview,
.works{
grid-template-columns:1fr;
}

h1{
font-size:28px;
}

}

</style>

</head>

<body>

<header>

<div class="wrap nav">

<div class="logo">
صمم <span>ديكورك</span>
</div>

<a
href="index.html"
class="back">

← الموقع

</a>

</div>

</header>


<main>

<div class="wrap">

<h1>
لوحة الإدارة
</h1>

<p class="subtitle">
إدارة أعمال صمم ديكورك
</p>


<!-- LOGIN -->

<div
class="panel"
id="loginBox">

<h2>
🔐 دخول الإدارة
</h2>

<br>

<div class="field">

<label>
كلمة السر
</label>

<input
type="password"
id="password"
placeholder="كلمة سر الإدارة">

</div>

<button
class="btn btn-main"
onclick="login()">

دخول

</button>

<div
id="loginMessage"
class="message">
</div>

</div>


<!-- ADMIN -->

<div
id="admin"
style="display:none;">


<!-- UPLOAD -->

<div class="panel">

<h2>
📸 إضافة أعمال جديدة
</h2>

<br>


<div class="field">

<label>
القسم
</label>

<select id="category">

<option value="kitchen">
المطابخ
</option>

<option value="dressing">
Dressing
</option>

<option value="wardrobes">
البلاكرات
</option>

<option value="salon">
الصالونات
</option>

<option value="bedroom">
غرف النوم
</option>

<option value="tv">
Meuble TV
</option>

<option value="tapisserie">
طابيسري
</option>

</select>

</div>


<div class="field">

<label>
اسم المشروع
</label>

<input
id="title"
placeholder="مثلاً: مطبخ مودرن">

</div>


<div
class="drop"
onclick="
document.getElementById('fileInput').click()
">

<strong>
📷 اختار الصور
</strong>

<span>
تقدر تختار عدة صور مرة وحدة
</span>

</div>


<input
id="fileInput"
type="file"
accept="image/*"
multiple
onchange="preview()">


<div
id="preview"
class="preview">
</div>


<div
id="progress"
class="progress">
</div>


<button
id="uploadBtn"
class="btn btn-main"
onclick="upload()">

📤 نشر الأعمال

</button>


<div
id="message"
class="message">
</div>

</div>


<!-- WORKS -->

<div class="panel">

<h2>
🖼️ الأعمال الحالية
</h2>

<br>

<div
id="works"
class="works">

جاري التحميل...

</div>

</div>


</div>

</div>

</main>


<script>

const CLOUD_NAME =
"rhao0lli";

const UPLOAD_PRESET =
"samemdecork_images";

let password = "";

let files = [];


/* LOGIN */

async function login(){

const value =
document
.getElementById("password")
.value;

const msg =
document.getElementById("loginMessage");


if(!value){

msg.className=
"message error";

msg.textContent=
"دخل كلمة السر.";

return;

}


try{

const response =
await fetch(
"/api/admin-check",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
password:value
})
});


const data =
await response.json();


if(!response.ok || !data.ok){

msg.className=
"message error";

msg.textContent=
"كلمة السر غير صحيحة.";

return;

}


password=value;

document
.getElementById("loginBox")
.style.display="none";

document
.getElementById("admin")
.style.display="block";

loadWorks();


}catch(error){

msg.className=
"message error";

msg.textContent=
"تعذر الاتصال بالسيرفر.";

}

}


/* PREVIEW */

function preview(){

const input =
document.getElementById("fileInput");

files =
Array.from(input.files);

const box =
document.getElementById("preview");

box.innerHTML="";


files.forEach(file=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

box.appendChild(img);

});

}


/* UPLOAD */

async function upload(){

const category =
document.getElementById("category")
.value;

const title =
document.getElementById("title")
.value.trim();

const btn =
document.getElementById("uploadBtn");

const progress =
document.getElementById("progress");

const message =
document.getElementById("message");


if(!files.length){

showMessage(
message,
"اختار الصور أولاً.",
false
);

return;

}


if(!title){

showMessage(
message,
"دخل اسم المشروع.",
false
);

return;

}


btn.disabled=true;


try{

for(
let i=0;
i<files.length;
i++
){

progress.textContent=
`جاري رفع الصورة ${i+1} من ${files.length}...`;


const form =
new FormData();


form.append(
"file",
files[i]
);

form.append(
"upload_preset",
UPLOAD_PRESET
);

form.append(
"folder",
`chtaibi2026/${category}`
);


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

{
method:"POST",
body:form
}

);


if(!response.ok){

throw new Error(
"Cloudinary upload error"
);

}

}


progress.textContent=
"تم رفع الصور بنجاح ✅";


showMessage(
message,
"الصور دابا منشورة في أعمالنا.",
true
);


document
.getElementById("fileInput")
.value="";

document
.getElementById("title")
.value="";

document
.getElementById("preview")
.innerHTML="";

files=[];

loadWorks();


}catch(error){

console.error(error);

showMessage(
message,
"وقع مشكل في رفع الصور.",
false
);

}finally{

btn.disabled=false;

}

}


/* LOAD */

async function loadWorks(){

const box =
document.getElementById("works");

box.innerHTML=
"جاري التحميل...";


try{

const response =
await fetch("/api/works");

const data =
await response.json();


if(!data.length){

box.innerHTML=
"مازال ما كاين حتى عمل.";

return;

}


box.innerHTML="";


data.forEach(work=>{

const div =
document.createElement("div");

div.className="work";


div.innerHTML=`

<img
src="${safe(work.image)}"
alt="عمل صمم ديكورك">

<div class="info">

<strong>
${safe(work.title)}
</strong>

<small>
${safe(work.category)}
</small>

<button
class="btn btn-danger delete"
onclick="deleteWork(${JSON.stringify(work.public_id)})">

🗑️ حذف

</button>

</div>

`;

box.appendChild(div);

});


}catch(error){

console.error(error);

box.innerHTML=
"تعذر تحميل الأعمال.";

}

}


/* DELETE */

async function deleteWork(publicId){

if(
!confirm(
"واش متأكد بغيتي تحذف هاد الصورة؟"
)
){

return;

}


try{

const response =
await fetch(
"/api/delete-work",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
password:password,
public_id:publicId
})
});


if(!response.ok){

throw new Error();

}


alert(
"تم حذف الصورة بنجاح ✅"
);

loadWorks();


}catch(error){

alert(
"تعذر حذف الصورة."
);

}

}


/* MESSAGE */

function showMessage(
element,
text,
success
){

element.className=
success
? "message success"
: "message error";

element.textContent=text;

}


/* SAFE */

function safe(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>

</html>
