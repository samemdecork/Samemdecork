<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>أعمالنا | صمم ديكورك</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f0e8;
  color:#17231d;
}

.wrap{
  width:min(1200px,92%);
  margin:auto;
}

/* HEADER */

header{
  background:#17231d;
  color:white;
  padding:20px 0;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#c9aa7b;
}

.back{
  color:white;
  text-decoration:none;
  border:1px solid #c9aa7b;
  padding:10px 18px;
  border-radius:25px;
}

/* HERO */

.hero{
  padding:70px 0 40px;
  text-align:center;
}

.hero small{
  color:#9a7d58;
  letter-spacing:2px;
}

.hero h1{
  font-size:clamp(40px,6vw,65px);
  margin:12px 0;
}

.hero p{
  color:#70736e;
  line-height:2;
}

/* GALLERY */

.gallery{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:15px;

  padding:
    20px 0
    80px;
}

.photo{
  height:350px;
  overflow:hidden;
  border-radius:5px;
  background:#ddd;
  position:relative;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.photo:hover img{
  transform:scale(1.06);
}

.photo-info{
  position:absolute;
  right:0;
  left:0;
  bottom:0;

  padding:25px 18px 15px;

  color:white;

  background:
    linear-gradient(
      transparent,
      #000b
    );
}

.photo-info strong{
  font-size:18px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:50px;
  color:#777;
}

.spinner{
  width:45px;
  height:45px;

  border:4px solid #ddd;
  border-top-color:#c9aa7b;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto
    20px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* EMPTY */

.empty{
  text-align:center;
  padding:60px 20px;
  color:#777;
}

/* FOOTER */

footer{
  background:#101a15;
  color:#aaa;
  text-align:center;
  padding:30px;
  line-height:2;
}

footer strong{
  color:#c9aa7b;
}

/* MOBILE */

@media(max-width:800px){

  .gallery{
    grid-template-columns:1fr 1fr;
  }

  .photo{
    height:280px;
  }

}

@media(max-width:550px){

  .gallery{
    grid-template-columns:1fr;
  }

  .photo{
    height:320px;
  }

  .nav{
    gap:15px;
  }

}

</style>

</head>


<body>


<header>

<div class="wrap nav">

<a
  href="index.html"
  class="logo">

صمم <span>ديكورك</span>

</a>

<a
  href="index.html"
  class="back">

← الرئيسية

</a>

</div>

</header>


<section class="hero">

<div class="wrap">

<small>
REAL PROJECTS
</small>

<h1>
أعمالنا
</h1>

<p>
صور حقيقية من أعمال ومشاريع
صمم ديكورك
</p>

</div>

</section>


<main class="wrap">


<div
  id="loading"
  class="loading">

<div class="spinner"></div>

جاري تحميل الأعمال...

</div>


<div
  id="gallery"
  class="gallery"
  style="display:none">
</div>


<div
  id="empty"
  class="empty"
  style="display:none">

<h2>
مازال ما كايناش صور
</h2>

<p>
أول ما ترفع الصور من لوحة الإدارة
غادي يبانوا هنا.
</p>

</div>


</main>


<footer>

<strong>
صمم ديكورك
</strong>

© 2026

<br>

جميع الحقوق محفوظة —
<strong>
Hamza Chtaibi
</strong>

</footer>


<script>

async function loadImages(){

  const loading =
    document.getElementById("loading");

  const gallery =
    document.getElementById("gallery");

  const empty =
    document.getElementById("empty");


  try{

    const response =
      await fetch("/api/images");


    if(!response.ok){

      throw new Error(
        "Failed to load images"
      );

    }


    const data =
      await response.json();


    loading.style.display =
      "none";


    if(
      !data.images ||
      data.images.length === 0
    ){

      empty.style.display =
        "block";

      return;

    }


    gallery.style.display =
      "grid";


    data.images.forEach(image => {

      const item =
        document.createElement("div");

      item.className =
        "photo";


      const img =
        document.createElement("img");

      img.src =
        image.url;

      img.alt =
        "عمل من صمم ديكورك";

      img.loading =
        "lazy";


      const info =
        document.createElement("div");

      info.className =
        "photo-info";


      const title =
        document.createElement("strong");

      title.textContent =
        "صمم ديكورك";


      info.appendChild(title);

      item.appendChild(img);

      item.appendChild(info);

      gallery.appendChild(item);

    });


  }catch(error){

    console.error(error);

    loading.innerHTML = `

      <h2>
        وقع مشكل في تحميل الصور
      </h2>

      <p>
        حاول تعاود تحديث الصفحة.
      </p>

    `;

  }

}


loadImages();

</script>


</body>

</html>
