<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صمم ديكورك — المطبخ</title>
<style>
:root{--g:#344c35;--c:#fbf8f1;--l:#d9cfbf;--s:#71806c}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#263126;font-family:Tahoma,Arial}.page{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;height:70px}.back,button,select,input{font:inherit}.back{border:1px solid var(--l);background:white;border-radius:14px;padding:10px 15px}.hero{background:linear-gradient(135deg,#eee3d1,#d8c9b3);border:1px solid var(--l);border-radius:28px;padding:28px}.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:#6f675d}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid var(--l);background:#fff;border-radius:16px;padding:14px;text-align:right}.option.active{border:2px solid var(--g);background:#f0f4ee}.muted{color:#766e63;font-size:13px}label{display:block;margin:16px 0 7px;font-weight:bold}input[type=number],select{width:100%;padding:12px;border:1px solid var(--l);border-radius:13px;background:white}.preview{height:350px;border-radius:20px;background:linear-gradient(#eee6da 0 64%,#b99b72 65%);position:relative;overflow:hidden}.wall{position:absolute;top:13%;right:8%;width:84%;height:28%;background:#d7c9b5;border-radius:8px;display:flex;gap:4px;padding:5px}.wall span,.base span{flex:1;background:#eee8dc;border-radius:4px}.counter{position:absolute;right:6%;bottom:30%;width:88%;height:13%;background:#777f70;border-radius:5px}.base{position:absolute;right:7%;bottom:8%;width:86%;height:24%;display:flex;gap:5px}.base span{background:#d8c7af}.island{position:absolute;left:9%;bottom:15%;width:30%;height:17%;background:#65705f;border-radius:6px}.result{margin-top:15px;background:var(--g);color:white;border-radius:20px;padding:18px}.price{font-size:30px;font-weight:bold;margin:7px 0}.save{width:100%;border:0;background:white;color:#263126;border-radius:13px;padding:12px;margin-top:10px}.note{background:#f5f0e7;border-radius:14px;padding:12px;margin-top:12px;font-size:13px;line-height:1.8}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style></head><body><div class="page">
<header><button class="back" onclick="history.back()">← رجوع</button><b style="font-size:22px">صمم ديكورك</b></header>
<section class="hero"><h1>صمّم مطبخك</h1><p>اختار الشكل، دخل القياسات، حدد الخامة والتشطيب، وشوف تقدير أولي.</p></section>
<div class="layout"><section class="card"><h2>1. شكل المطبخ</h2><div class="grid">
<button class="option active" onclick="shape(this,'مستقيم')"><b>مستقيم</b><br><span class="muted">بسيط وعملي</span></button>
<button class="option" onclick="shape(this,'L')"><b>L</b><br><span class="muted">استغلال الزوايا</span></button>
<button class="option" onclick="shape(this,'U')"><b>U</b><br><span class="muted">مساحة أكبر</span></button>
<button class="option" onclick="shape(this,'جزيرة')"><b>جزيرة</b><br><span class="muted">ستايل راقي</span></button></div>
<h2 style="margin-top:25px">2. القياسات</h2><div class="grid"><div><label>الطول (م)</label><input id="l" type="number" value="4" min="1" step=".1" oninput="calc()"></div><div><label>العرض (م)</label><input id="w" type="number" value="2.5" min="1" step=".1" oninput="calc()"></div></div>
<label>الخامة</label><select id="m" onchange="calc()"><option value="900">MDF اقتصادي</option><option value="1200" selected>MDF + ميلامين</option><option value="1550">Lacquer راقي</option><option value="2100">خشب طبيعي Premium</option></select>
<label>التشطيب</label><select id="f" onchange="calc()"><option value="1">اقتصادي</option><option value="1.2" selected>متوسط</option><option value="1.45">Premium</option><option value="1.8">Luxury</option></select>
<div class="note">الثمن تقريبي. من بعد نزيدو الأجهزة، الرخام، الإكسسوارات وعدد الخزانات.</div></section>
<section class="card"><h2>المعاينة الأولية</h2><div class="preview"><div class="wall"><span></span><span></span><span></span><span></span></div><div class="counter"></div><div class="base"><span></span><span></span><span></span><span></span></div><div id="island" class="island" style="display:none"></div></div>
<div class="result">المساحة: <b id="a">10</b> m²<div class="price"><span id="p">18,000</span> DH</div><span class="muted" style="color:#d8dfd6">تقدير أولي حسب الاختيارات</span><button class="save" onclick="alert('تم حفظ التصميم التجريبي')">حفظ تصميم المطبخ</button></div></section></div></div>
<script>
let s='مستقيم';function shape(e,x){document.querySelectorAll('.option').forEach(b=>b.classList.remove('active'));e.classList.add('active');s=x;document.getElementById('island').style.display=x==='جزيرة'?'block':'none';calc()}function calc(){let a=(+l.value||0)*(+w.value||0),q={مستقيم:1,L:1.15,U:1.3,جزيرة:1.5}[s],t=Math.round(a*(+m.value)*(+f.value)*q/100)*100;document.getElementById('a').textContent=a.toFixed(1);document.getElementById('p').textContent=t.toLocaleString('fr-FR')}calc();
</script></body></html>
