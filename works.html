<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>أعمالنا | صمم ديكورك</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f0e8;
  color:#17231d;
}

header{
  background:#17231d;
  color:white;
  padding:18px 0;
  position:sticky;
  top:0;
  z-index:50;
}

.wrap{
  width:min(1200px,92%);
  margin:auto;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#c9aa7b;
}

.home{
  background:white;
  color:#17231d;
  padding:10px 18px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:55px 15px 35px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#777;
  line-height:1.8;
}

.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin:20px auto 35px;
}

.filter{
  border:1px solid #d8cbb9;
  background:white;
  color:#17231d;
  padding:10px 17px;
  border-radius:25px;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
}

.filter.active,
.filter:hover{
  background:#17231d;
  color:white;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
  padding-bottom:70px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 20px #0001;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 30px #0002;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.card-info{
  padding:15px;
}

.card-info h3{
  margin-bottom:6px;
}

.card-info p{
  color:#888;
  font-size:14px;
}

.empty{
  display:none;
  text-align:center;
  padding:50px 20px;
  color:#777;
}


/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(700px,100%);
  max-height:95vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  position:relative;
  padding:12px;
}

.close{
  position:absolute;
  top:10px;
  left:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#17231d;
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:5;
}

.modal-img{
  width:100%;
  max-height:65vh;
  object-fit:contain;
  border-radius:14px;
  background:#eee;
}

.modal-info{
  padding:18px 8px 8px;
}

.modal-info h2{
  margin-bottom:7px;
}

.modal-info p{
  color:#777;
  margin-bottom:15px;
}

.whatsapp{
  display:block;
  width:100%;
  padding:15px;
  border-radius:12px;
  background:#25D366;
  color:white;
  text-align:center;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
}

.whatsapp:hover{
  opacity:.9;
}

@media(max-width:600px){

  .nav{
    flex-direction:column;
  }

  .hero h1{
    font-size:30px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .card img{
    height:180px;
  }

  .card-info{
    padding:10px;
  }

  .card-info h3{
    font-size:15px;
  }

}
</style>
</head>

<body>

<header>
  <div class="wrap nav">
    <div class="logo">
      صمم <span>ديكورك</span>
    </div>

    <a href="index.html" class="home">
      الرئيسية
    </a>
  </div>
</header>

<section class="hero">
  <h1>أعمالنا وموديلاتنا</h1>
  <p>
    شوف الموديلات واختار التصميم اللي عجبك،
    ومن بعد صيفطو لينا مباشرة عبر WhatsApp.
  </p>
</section>

<div class="wrap">

  <div class="filters">
    <button class="filter active" data-filter="all">الكل</button>
    <button class="filter" data-filter="kitchen">المطابخ</button>
    <button class="filter" data-filter="salon">الصالونات</button>
    <button class="filter" data-filter="bedroom">غرف النوم</button>
    <button class="filter" data-filter="dressing">Dressing</button>
    <button class="filter" data-filter="meuble-tv">Meuble TV</button>
    <button class="filter" data-filter="tapisserie">طابيسري</button>
  </div>

  <div id="gallery" class="gallery"></div>

  <div id="empty" class="empty">
    ما كايناش صور فهاد القسم حالياً.
  </div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <img id="modalImg" class="modal-img" src="" alt="موديل">

    <div class="modal-info">

      <h2 id="modalTitle"></h2>

      <p>
        عجبك هاد الموديل؟
        ضغط على الزر وصيفطو لينا عبر WhatsApp.
      </p>

      <a id="whatsappBtn"
         class="whatsapp"
         href="#"
         target="_blank">
        💬 اختيار هذا الموديل وإرسال WhatsApp
      </a>

    </div>

  </div>

</div>


<script>

/* ============================
   رقم WhatsApp ديالك
   بدل الرقم فقط
   ============================ */

const WHATSAPP_NUMBER = "212600000000";


/* ============================
   الصور
   ============================ */

const projects = [

  {
    image:"work-001.webp",
    category:"kitchen",
    title:"مطبخ مودرن"
  },

  {
    image:"work-002.webp",
    category:"kitchen",
    title:"مطبخ عصري"
  },

  {
    image:"work-003.webp",
    category:"salon",
    title:"صالون مودرن"
  },

  {
    image:"work-004.webp",
    category:"salon",
    title:"صالون مغربي عصري"
  },

  {
    image:"work-005.webp",
    category:"bedroom",
    title:"غرفة نوم"
  },

  {
    image:"work-006.webp",
    category:"bedroom",
    title:"غرفة نوم مودرن"
  },

  {
    image:"work-007.webp",
    category:"dressing",
    title:"Dressing"
  },

  {
    image:"work-008.webp",
    category:"meuble-tv",
    title:"Meuble TV"
  },

  {
    image:"work-009.webp",
    category:"tapisserie",
    title:"طابيسري"
  },

  {
    image:"work-010.webp",
    category:"tapisserie",
    title:"ستور وطابيسري"
  }

];


/* ============================
   عرض الصور
   ============================ */

const gallery =
  document.getElementById("gallery");

const empty =
  document.getElementById("empty");


function render(filter="all"){

  gallery.innerHTML="";

  const list =
    filter === "all"
    ? projects
    : projects.filter(
        item => item.category === filter
      );

  if(list.length === 0){

    empty.style.display="block";
    return;

  }

  empty.style.display="none";

  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <img
        src="${item.image}"
        alt="${item.title}"
        loading="lazy"
      >

      <div class="card-info">

        <h3>${item.title}</h3>

        <p>
          اضغط على الصورة لاختيار الموديل
        </p>

      </div>

    `;

    card.onclick =
      () => openModal(item);

    gallery.appendChild(card);

  });

}


/* ============================
   الفلاتر
   ============================ */

document
.querySelectorAll(".filter")
.forEach(button => {

  button.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".filter")
      .forEach(
        b => b.classList.remove("active")
      );

      this.classList.add("active");

      render(
        this.dataset.filter
      );

    }
  );

});


/* ============================
   فتح الصورة
   ============================ */

function openModal(item){

  const modal =
    document.getElementById("modal");

  const modalImg =
    document.getElementById("modalImg");

  const modalTitle =
    document.getElementById("modalTitle");

  const whatsappBtn =
    document.getElementById("whatsappBtn");


  modalImg.src =
    item.image;

  modalTitle.textContent =
    item.title;


  /*
    رابط الصورة الحالي
  */

  const imageUrl =
    new URL(
      item.image,
      window.location.href
    ).href;


  const message =
    `السلام عليكم، عجبني هاد الموديل: ${item.title}

رابط الصورة:
${imageUrl}

بغيت نعرف الثمن والتفاصيل.`;


  whatsappBtn.href =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


  modal.classList.add("show");

}


/* ============================
   إغلاق
   ============================ */

function closeModal(){

  document
  .getElementById("modal")
  .classList.remove("show");

}


document
.getElementById("modal")
.addEventListener(
  "click",
  function(e){

    if(e.target === this){

      closeModal();

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeModal();

    }

  }
);


/* تشغيل */

render();

</script>

</body>
</html>
